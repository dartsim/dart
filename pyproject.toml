[build-system]
# Fallback PyPA CMake for isolated source builds (`pip install .`). The Pixi
# wheel tasks use the Pixi CMake package directly, so CI does not exercise it.
# CMake 4.3.4 regressed GLUT/OpenGL detection in DART 6 wheel builds:
# find_package(GLUT) failed, dart-gui was skipped, and dartpy aborted with
# "Cannot find the library dart-gui". Confirm GLUT detection in the wheel
# build environment before changing this pin.
requires = ["setuptools>=84.0.0", "wheel", "ninja", "cmake>=4.4.3,<4.4.4"]
build-backend = "setuptools.build_meta"

[tool.black]
exclude = '/(build|dist|docs|examples|external|python|\.pixi)/'

[tool.isort]
profile = "black"
skip = ['build', 'dist', 'docs', 'examples', 'external', 'python', '.pixi']

[tool.mypy]
files = "setup.py"
python_version = "3.7"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ninja"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
