name: Setup pixi (CI)
description: Setup pixi with hosted cache settings, optional self-hosted install retries, and sccache.
inputs:
  pixi-version:
    description: Optional pixi version to install.
    default: ""
  pixi-bin-path:
    description: Path to the pixi binary.
    required: true
  cache:
    description: >-
      Enable the setup-pixi environment cache on GitHub-hosted runners.
      Off by default: `pixi install --locked` from conda-forge takes well
      under a minute, while the cached environments (~500-600 MB each per
      platform) consumed a third of the repository's 10 GB Actions cache and
      evicted the compiler cache that every build depends on.
    default: "false"
  environments:
    description: Space-separated pixi environment names to install on GitHub-hosted runners.
    default: "default"
  post-cleanup:
    description: Enable pixi post-cleanup on GitHub-hosted runners.
    default: "true"
  run-install:
    description: Run pixi install on GitHub-hosted runners.
    default: "true"
  self-hosted-install:
    description: Run pixi install on self-hosted runners with retries.
    default: "true"
  install-args:
    description: Extra arguments for pixi install on self-hosted runners.
    default: ""
  install-retries:
    description: Number of pixi install attempts on self-hosted runners.
    default: "3"
  install-backoff-seconds:
    description: Base seconds between pixi install retries on self-hosted runners.
    default: "20"
  enable-sccache:
    description: Enable sccache setup on GitHub-hosted runners.
    default: "true"
  sccache-disable-annotations:
    description: >-
      Disable the sccache-action post-step stats (hit ratio annotation and job
      summary table). Off by default so every job records hit/miss evidence;
      the launcher and the stats client are the same action-provided binary,
      so the historical client/server version mismatch no longer applies.
    default: "false"
  sccache-continue-on-error:
    description: Continue if sccache setup fails.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ inputs.pixi-version }}
        cache: ${{ inputs.cache == 'true' && runner.environment == 'github-hosted' }}
        environments: ${{ inputs.run-install == 'true' && runner.environment == 'github-hosted' && inputs.environments || '' }}
        post-cleanup: ${{ inputs.post-cleanup == 'true' && runner.environment == 'github-hosted' }}
        run-install: ${{ inputs.run-install == 'true' && runner.environment == 'github-hosted' }}
        pixi-bin-path: ${{ inputs.pixi-bin-path }}

    - name: Pixi install (retry)
      if: ${{ inputs.self-hosted-install == 'true' && !runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        retries=${{ inputs.install-retries }}
        backoff=${{ inputs.install-backoff-seconds }}
        args="${{ inputs.install-args }}"
        environments="${{ inputs.environments }}"

        install_pixi_environment() {
          if [ -n "${args}" ]; then
            pixi install ${args}
            return
          fi

          if [ -n "${environments}" ]; then
            for environment in ${environments}; do
              pixi install --environment "${environment}" || return $?
            done
            return
          fi

          pixi install
        }

        for attempt in $(seq 1 "${retries}"); do
          if install_pixi_environment; then
            exit 0
          fi
          echo "pixi install failed (attempt ${attempt}/${retries})" >&2
          sleep $((attempt * backoff))
        done
        exit 1

    - name: Setup sccache
      if: ${{ inputs.enable-sccache == 'true' && runner.environment == 'github-hosted' }}
      continue-on-error: ${{ inputs.sccache-continue-on-error == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        disable_annotations: ${{ inputs.sccache-disable-annotations }}
