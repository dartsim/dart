name: Setup DART Linux CI
description: >-
  One-stop setup for a GitHub-hosted Linux build job after checkout: optional
  disk reclaim, pixi with the sccache action, the Mesa/xvfb apt packages, and
  the compiler-cache launcher with its fail-loud guard.
inputs:
  free-disk-space:
    description: >-
      Reclaim the large preinstalled toolchains (~25 GB) before building. Use
      for the Debug, coverage, ASAN, and Release+dartpy+examples trees, which
      otherwise run out of space on the hosted runner.
    default: "false"
  environments:
    description: Space-separated pixi environments to install.
    default: "default"
  install-args:
    description: Extra arguments for pixi install on self-hosted runners.
    default: ""
  apt-packages:
    description: apt packages the job needs (Mesa GL, xvfb, mesa-utils by default).
    default: "libgl1-mesa-dev libglu1-mesa-dev xvfb mesa-utils"
  require-cache:
    description: Forwarded to configure-compiler-cache.
    default: "true"
runs:
  using: composite
  steps:
    - name: Free up disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: |
        set -x
        df -h /
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        sudo docker image prune --all --force || true
        df -h /

    - name: Setup pixi (CI)
      uses: ./.github/actions/setup-pixi-ci
      with:
        pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
        environments: ${{ inputs.environments }}
        install-args: ${{ inputs.install-args }}

    - name: Install system dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: ${{ inputs.apt-packages }}
        version: 4

    - name: Configure environment for compiler cache
      uses: ./.github/actions/configure-compiler-cache
      with:
        require-cache: ${{ inputs.require-cache }}
