# Linux toolchain coverage: build + test DART under specific compiler
# toolchains that the normal jobs do not exercise.
#
# This replaces the former Docker-based "Alt Linux repro" job, whose only
# durable value was compiling DART with a substantially newer gcc/glibc/libstdc++
# than the stock Ubuntu toolchain (the pixi environment pins no compiler, so
# every other Linux job uses the runner's system compiler). We get that same
# forward-compat signal with no container and none of the rolling-image / DinD
# flakiness, by installing the requested compiler on a hosted runner and building
# + testing through the existing pixi tasks.
#
# To add a toolchain (e.g. an oldest-supported gcc, or a pinned compiler), add a
# row to the matrix below: { name, runner, family (gcc|clang), version, cc, cxx,
# distribution (true for Ubuntu-packaged compilers) }.

name: CI Toolchain (Linux)

on:
  # Nightly only: nightly.yml calls this every night; dispatch it to check a
  # branch on demand.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-toolchain-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-toolchain-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  toolchain:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # A brand-new compiler can surface breakage; as a nightly-only job it never
    # blocks merges, and a failure opens a nightly-failure issue instead.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc 11 (Ubuntu 22.04 baseline)
            runner: ubuntu-22.04
            family: gcc
            version: "11"
            cc: gcc-11
            cxx: g++-11
            distribution: true
          - name: clang 13 (Ubuntu 22.04 baseline)
            runner: ubuntu-22.04
            family: clang
            version: "13"
            cc: clang-13
            cxx: clang++-13
            distribution: true
          # GCC 16 is not in Ubuntu 24.04; it comes from the Ubuntu toolchain
          # PPA. It is the compiler that exposed dartsim/dart#3447 (aligned
          # vector stores in base-object constructors of Frame-derived classes).
          - name: gcc 16
            runner: ubuntu-24.04
            family: gcc
            version: "16"
            cc: gcc-16
            cxx: g++-16
            distribution: false
          - name: clang 19
            runner: ubuntu-24.04
            family: clang
            version: "19"
            cc: clang-19
            cxx: clang++-19
            distribution: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ${{ matrix.cc }}
        env:
          FAMILY: ${{ matrix.family }}
          VERSION: ${{ matrix.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          if [ "${DISTRIBUTION}" = "true" ]; then
            sudo apt-get update
            if [ "${FAMILY}" = "gcc" ]; then
              sudo apt-get install -y "gcc-${VERSION}" "g++-${VERSION}"
            else
              sudo apt-get install -y "clang-${VERSION}"
            fi
          elif [ "${FAMILY}" = "gcc" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y "gcc-${VERSION}" "g++-${VERSION}"
          else
            # apt.llvm.org provides the newest Clang releases.
            wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh "${VERSION}"
            sudo apt-get install -y "clang-${VERSION}"
          fi

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Configure, build tests, and run ctest
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          # The runner context is unavailable in job-level env, so set this per step.
          SCCACHE_DIR: ${{ runner.temp }}/sccache-${{ matrix.runner }}-${{ matrix.cc }}
        run: |
          set -euo pipefail
          "${CC}" --version
          pixi run test-build-requirements
          # CC/CXX are honored by the `config` task that `build-tests` runs
          # first (it does not pin a compiler), so the whole tree is compiled
          # with the selected toolchain.
          pixi run build-tests
          pixi run -- bash -c 'ctest --test-dir "build/${PIXI_ENVIRONMENT_NAME}/cpp/Release" --output-on-failure -j2'
