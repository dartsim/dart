# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI Windows

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  # Nightly (nightly.yml) runs this workflow on main every night.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-windows-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-windows-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  build:
    # The two halves of `pixi run test-all` on modern parallel runners, each ~2/3 of
    # the cold build. On MSVC, target ALL is exactly tests_and_run + pytest:
    # CMakeLists.txt adds examples and tutorials to ALL only for other
    # compilers. Branch protection requires both checks.
    # Keep the modern check names used by branch protection.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: write # The last step prunes superseded compiler caches.
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: Release
      CC: cl
      CXX: cl
      BUILD_TYPE: Release
      DART_VERBOSE: "ON"
      DART_COMPILER_CACHE: sccache
      # A full unity build of one part caches 20-35 MiB. The cap bounds each
      # snapshot; objects no build hits any more age out under it.
      SCCACHE_CACHE_SIZE: "250M"
      # The compiler-cache snapshot this run saves: main pushes save the whole
      # cache, same-repository PR runs save the objects their own runs
      # compiled, and other runs (forks, which may not save caches) save none.
      SCCACHE_SNAPSHOT: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main'
            || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name == github.repository) && 'pr'
            || '' }}
      # Preserve build counters through long links and test runs.
      SCCACHE_IDLE_TIMEOUT: "0"
      CTEST_PARALLEL_LEVEL: "4"
      # Whole-program optimization (/GL) runs an expensive link-time /LTCG
      # codegen pass that makes the MSVC Release build run for hours, overrunning
      # the job timeout. Disable it for the CI C++/dartpy test build; the
      # published wheels (publish_dartpy.yml) keep it on and are still tested.
      DART_MSVC_DISABLE_WHOLE_PROGRAM_OPTIMIZATION: "ON"
      # Drop unreferenced inline functions from objects, as MSBuild projects do
      # by default: objects are 60% smaller, so cache snapshots and links are
      # too. Compile time is unchanged (same-VM benchmark, 20 files).
      CXXFLAGS: /Zc:inline
    # Keep room for cold caches; a warm run without header changes takes
    # minutes.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-Release-cpp
            runner: windows-2025-vs2026
            part: cpp
            task: test # builds the C++ tests and runs ctest
            vsversion: ""
          - name: windows-Release-python
            runner: windows-2025-vs2026
            part: python
            task: test-py # builds dartpy and runs pytest
            vsversion: ""
          - name: windows-2022-Release-cpp
            runner: windows-2022
            part: cpp
            task: test
            # VS 2022 selects the v143 toolset family on this runner.
            vsversion: "2022"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: ${{ matrix.vsversion }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi.exe

      - name: Initialize sccache
        id: sccache-config
        run: |
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache')" >> $env:GITHUB_ENV
          "SCCACHE_PR_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache-pr')" >> $env:GITHUB_ENV
          "prefix=sccache-v2-win-${{ matrix.part }}${{ matrix.vsversion }}-$env:VCToolsVersion" >> $env:GITHUB_OUTPUT

      # PRs restore the newest main snapshot, then their own newest snapshot on
      # top, so a PR pays only for what it changed since its previous push.
      # The MSVC version in the key skips snapshots made by an older compiler.
      - name: Restore sccache (main)
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.sccache-config.outputs.prefix }}-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.sccache-config.outputs.prefix }}-main-

      - name: Restore sccache (this PR)
        if: env.SCCACHE_SNAPSHOT == 'pr'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_PR_DIR }}
          key: ${{ steps.sccache-config.outputs.prefix }}-pr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.sccache-config.outputs.prefix }}-pr-

      # Record main's objects before this PR's join them, so the PR snapshot
      # saved below holds only what this PR's runs compiled: tens of MB rather
      # than a copy of main's whole cache.
      - name: Merge PR snapshot
        if: env.SCCACHE_SNAPSHOT == 'pr'
        run: |
          New-Item -ItemType Directory -Force $env:SCCACHE_DIR | Out-Null
          # WriteAllLines also writes the file when main had no snapshot.
          [System.IO.File]::WriteAllLines((Join-Path $env:RUNNER_TEMP 'sccache-main.txt'),
            [string[]]@(Get-ChildItem -Recurse -File -Name $env:SCCACHE_DIR))
          if (Test-Path $env:SCCACHE_PR_DIR) {
            robocopy $env:SCCACHE_PR_DIR $env:SCCACHE_DIR /E /MOVE /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Native Windows hook smoke
        if: matrix.part == 'cpp'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          pixi run python -c "import sys; print(sys.executable)"
          $launcher = Join-Path $env:GITHUB_WORKSPACE ".claude/hooks/pre-commit-guard.ps1"
          $hookCommand = '& (Join-Path (git rev-parse --show-toplevel) ''.claude/hooks/pre-commit-guard.ps1''); if (-not $?) { exit 2 }; if ($LASTEXITCODE -ne 0) { exit 2 }; exit 0'
          # The malformed probe writes expected native stderr. PowerShell 5.1
          # must continue long enough to preserve and assert the exit code.
          $ErrorActionPreference = "Continue"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git status"}}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $successExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          if ($successExit -ne 0) {
            throw "non-commit hook payload exited $successExit instead of 0"
          }
          $env:DART_HOOK_DRY_RUN = "1"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git commit --no-verify -m x"}}'
          $diagnosticOutput = powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand 2>&1
          $diagnosticExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          Remove-Item Env:DART_HOOK_DRY_RUN
          if ($diagnosticExit -ne 0) {
            throw "successful diagnostic hook payload exited $diagnosticExit instead of 0"
          }
          $env:DART_HOOK_PAYLOAD = '{}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $blockedExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          '{"tool_input":{"command":"git status"}}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawSuccessExit = $LASTEXITCODE
          '{}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawBlockedExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($blockedExit -ne 2) {
            throw "malformed hook payload exited $blockedExit instead of 2"
          }
          if ($rawSuccessExit -ne 0 -or $rawBlockedExit -ne 2) {
            throw "raw-stdin fallback exited $rawSuccessExit/$rawBlockedExit instead of 0/2"
          }
          cmd.exe /c exit 0

      - name: Configure DART
        # Default MSVC Release flags omit /Zi, so sccache can cache objects.
        # Disable pybind11's implicit /GL and /LTCG as well as DART's tuning.
        # Unity builds compile each target's sources in batches of 8. MSVC
        # spends ~70% of each compile parsing headers such as dart/dart.hpp,
        # and batching shares that work: same-VM benchmark, dartpy objects
        # 4.5x and core objects 2.4x faster.
        run: >-
          pixi run config --
          -DDART_MSVC_DEFAULT_OPTIONS=ON
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DCMAKE_UNITY_BUILD=ON

      - name: Check build requirements
        if: matrix.part == 'cpp'
        run: pixi run test-build-requirements

      - name: Check Lint
        if: matrix.part == 'cpp'
        run: pixi run check-lint

      - name: Build and test
        id: build
        run: pixi run ${{ matrix.task }}

      # Print the final counters, then stop the server: after a cancellation
      # its in-flight compiles would keep writing to the cache while it is
      # archived, and tar fails with "file changed as we read it".
      - name: Stop sccache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        run: |
          pixi run sccache --stop-server
          Get-Process sccache -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0

      # Keys are immutable, so each run saves under its own key. Failed and
      # cancelled runs save too: every object sccache stored is valid, and the
      # next push resumes from them. A run stopped before the build started has
      # nothing new and would only replace the newest snapshot with an older one.
      - name: Collect PR snapshot
        if: >-
          always() && env.SCCACHE_SNAPSHOT == 'pr'
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        run: |
          $main = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]@(Get-Content (Join-Path $env:RUNNER_TEMP 'sccache-main.txt')),
            [System.StringComparer]::OrdinalIgnoreCase)
          New-Item -ItemType Directory -Force $env:SCCACHE_PR_DIR | Out-Null
          foreach ($file in Get-ChildItem -Recurse -File -Name $env:SCCACHE_DIR) {
            if ($main.Contains($file)) { continue }
            $target = Join-Path $env:SCCACHE_PR_DIR $file
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item (Join-Path $env:SCCACHE_DIR $file) $target
          }

      - name: Save sccache
        if: >-
          always() && env.SCCACHE_SNAPSHOT != ''
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_SNAPSHOT == 'pr' && env.SCCACHE_PR_DIR || env.SCCACHE_DIR }}
          key: ${{ steps.sccache-config.outputs.prefix }}-${{ env.SCCACHE_SNAPSHOT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune superseded compiler caches
        if: >-
          always() && env.SCCACHE_SNAPSHOT != ''
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ steps.sccache-config.outputs.prefix }}
        run: bash .github/actions/sccache/prune.sh "$PREFIX" "$SCCACHE_SNAPSHOT"

      # Linux CI covers install. On Windows, pixi run install configures a
      # separate install build tree after test-all has already passed, which
      # duplicates work and can keep the protected-branch runner busy for hours.
