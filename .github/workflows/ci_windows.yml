# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI Windows

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  schedule:
    # Offset from ci_ubuntu (02:00) and ci_macos (02:40) so the scheduled runs
    # do not stampede the shared/hosted runner pools simultaneously.
    - cron: "20 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual/tag evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v'))
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch'
        && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # dorny/paths-filter lists changed files through the pull-request API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      hooks: ${{ steps.hooks_filter.outputs.hooks }}
    steps:
      - name: Clean stale Linux workspace
        if: runner.os == 'Linux'
        run: |
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ "${GITHUB_WORKSPACE}" != "/" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || {
              if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
                docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" alpine:3.20 sh -c \
                  'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
              else
                echo "::warning::Unable to clean stale workspace entries before checkout."
              fi
            }
          fi

      # PR events list files through the API; push events fetch the `before`
      # commit on demand, so a full-history clone is not needed here.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters/ci-code.yml
          # Required so the `!` exclusions in the filter file act as excludes.
          predicate-quantifier: some-with-excludes
      - uses: dorny/paths-filter@v4
        id: hooks_filter
        with:
          # The native hook smoke below exercises the agent pre-commit guard,
          # which the shared code filter excludes (.claude/**). Run it when the
          # hook, its Python bridge, or the Python environment changes.
          filters: |
            hooks:
              - ".claude/hooks/**"
              - "scripts/pretool_guard_bridge.py"
              - "scripts/check_agent_hook.py"
              - "pixi.toml"
              - "pixi.lock"
              - ".github/workflows/ci_windows.yml"

  hook-smoke:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.hooks == 'true'
    name: Hook Smoke (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          run-install: false
          self-hosted-install: false
          enable-sccache: false
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi.exe

      - name: Native Windows hook smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          pixi run python -c "import sys; print(sys.executable)"
          $launcher = Join-Path $env:GITHUB_WORKSPACE ".claude/hooks/pre-commit-guard.ps1"
          $hookCommand = '& (Join-Path (git rev-parse --show-toplevel) ''.claude/hooks/pre-commit-guard.ps1''); if (-not $?) { exit 2 }; if ($LASTEXITCODE -ne 0) { exit 2 }; exit 0'
          # The malformed probe writes expected native stderr. PowerShell 5.1
          # must continue long enough to preserve and assert the exit code.
          $ErrorActionPreference = "Continue"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git status"}}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $successExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          if ($successExit -ne 0) {
            throw "non-commit hook payload exited $successExit instead of 0"
          }
          $env:DART_HOOK_DRY_RUN = "1"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git commit --no-verify -m x"}}'
          $diagnosticOutput = powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand 2>&1
          $diagnosticExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          Remove-Item Env:DART_HOOK_DRY_RUN
          if ($diagnosticExit -ne 0) {
            throw "successful diagnostic hook payload exited $diagnosticExit instead of 0"
          }
          $env:DART_HOOK_PAYLOAD = '{}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $blockedExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          '{"tool_input":{"command":"git status"}}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawSuccessExit = $LASTEXITCODE
          '{}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawBlockedExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($blockedExit -ne 2) {
            throw "malformed hook payload exited $blockedExit instead of 2"
          }
          if ($rawSuccessExit -ne 0 -or $rawBlockedExit -ne 2) {
            throw "raw-stdin fallback exited $rawSuccessExit/$rawBlockedExit instead of 0/2"
          }
          cmd.exe /c exit 0

  build:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    name: Tests (${{ matrix.build_type }})
    runs-on: windows-2025-vs2026
    env:
      # Pin the VS 2026 image required by DART's Windows toolchain floor.
      DART_WINDOWS_CMAKE_GENERATOR: Visual Studio 18 2026
      # ctest itself takes well under a minute (229 tests in ~30 s); the job is
      # build-bound. Keep the parallel level for the few long-pole tests.
      CTEST_PARALLEL_LEVEL: 4
      # Whole-program optimization (/GL) runs an expensive link-time /LTCG
      # codegen pass that dominates the MSVC Release build time. Disable it for
      # the CI C++/dartpy test build; the published wheels (publish_dartpy.yml)
      # keep it on and are still tested there.
      DART_MSVC_DISABLE_WHOLE_PROGRAM_OPTIMIZATION: "ON"
    # Fail fast on a regression instead of waiting for the ~6h default kill.
    # The uncached MSBuild Release build runs ~100-105 min; keep the cap
    # above that until the job gets a working compiler cache.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release"] # Windows CI keeps Release-only to keep runtimes acceptable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No compiler cache on this job yet: the pixi Windows tasks configure a
      # multi-config Visual Studio tree, and MSBuild ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER (CMake honors it for Makefile and
      # Ninja generators only), so wiring sccache here would only report a
      # launcher that never runs. Enabling it needs either a Ninja configure
      # under a Visual Studio developer environment (as the Windows wheel
      # already does through scikit-build-core) or sccache's MSBuild
      # integration (CMAKE_VS_GLOBALS CLToolExe/CLToolPath); recorded under
      # "Follow-ups" in docs/onboarding/ci-cd.md.
      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          run-install: false
          self-hosted-install: false
          enable-sccache: false
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi.exe

      # Lint checks are centralized in ci_lint.yml.

      - name: Test DART (dartpy disabled)
        run: |
          $ErrorActionPreference = "Stop"
          $env:DART_VERBOSE = "ON"
          $env:BUILD_TYPE = "${{ matrix.build_type }}"
          pixi run test-no-plane OFF

      # Skip install on Windows to keep job runtimes within limits; Linux covers install path.
