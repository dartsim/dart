# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI Windows

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  # Nightly (nightly.yml) runs this workflow on main every night.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-windows-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-windows-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  build:
    # Unique check name: `Release` alone is CI Linux's required context.
    name: windows-${{ matrix.build_type }}
    runs-on: windows-2025-vs2026
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      CC: cl
      CXX: cl
      BUILD_TYPE: ${{ matrix.build_type }}
      DART_VERBOSE: "ON"
      DART_COMPILER_CACHE: sccache
      SCCACHE_CACHE_SIZE: "1G"
      # Preserve build counters through long links and test runs.
      SCCACHE_IDLE_TIMEOUT: "0"
      CTEST_PARALLEL_LEVEL: "4"
      # Whole-program optimization (/GL) runs an expensive link-time /LTCG
      # codegen pass that makes the MSVC Release build run for hours, overrunning
      # the job timeout. Disable it for the CI C++/dartpy test build; the
      # published wheels (publish_dartpy.yml) keep it on and are still tested.
      DART_MSVC_DISABLE_WHOLE_PROGRAM_OPTIMIZATION: "ON"
    # Keep room for cold caches; the warm-cache target is under 25 minutes.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release"] # TODO: Add Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi.exe

      - name: Initialize sccache
        id: sccache-config
        run: |
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache')" >> $env:GITHUB_ENV
          "date=$([DateTime]::UtcNow.ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT

      - name: Restore sccache
        id: sccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v1-windows-2025-vs2026-msvc-ninja-x64-${{ matrix.build_type }}-${{ hashFiles('pixi.lock') }}-${{ steps.sccache-config.outputs.date }}
          restore-keys: |
            sccache-v1-windows-2025-vs2026-msvc-ninja-x64-${{ matrix.build_type }}-${{ hashFiles('pixi.lock') }}-

      - name: Native Windows hook smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          pixi run python -c "import sys; print(sys.executable)"
          $launcher = Join-Path $env:GITHUB_WORKSPACE ".claude/hooks/pre-commit-guard.ps1"
          $hookCommand = '& (Join-Path (git rev-parse --show-toplevel) ''.claude/hooks/pre-commit-guard.ps1''); if (-not $?) { exit 2 }; if ($LASTEXITCODE -ne 0) { exit 2 }; exit 0'
          # The malformed probe writes expected native stderr. PowerShell 5.1
          # must continue long enough to preserve and assert the exit code.
          $ErrorActionPreference = "Continue"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git status"}}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $successExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          if ($successExit -ne 0) {
            throw "non-commit hook payload exited $successExit instead of 0"
          }
          $env:DART_HOOK_DRY_RUN = "1"
          $env:DART_HOOK_PAYLOAD = '{"tool_input":{"command":"git commit --no-verify -m x"}}'
          $diagnosticOutput = powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand 2>&1
          $diagnosticExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          Remove-Item Env:DART_HOOK_DRY_RUN
          if ($diagnosticExit -ne 0) {
            throw "successful diagnostic hook payload exited $diagnosticExit instead of 0"
          }
          $env:DART_HOOK_PAYLOAD = '{}'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $hookCommand
          $blockedExit = $LASTEXITCODE
          Remove-Item Env:DART_HOOK_PAYLOAD
          '{"tool_input":{"command":"git status"}}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawSuccessExit = $LASTEXITCODE
          '{}' |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher
          $rawBlockedExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($blockedExit -ne 2) {
            throw "malformed hook payload exited $blockedExit instead of 2"
          }
          if ($rawSuccessExit -ne 0 -or $rawBlockedExit -ne 2) {
            throw "raw-stdin fallback exited $rawSuccessExit/$rawBlockedExit instead of 0/2"
          }
          cmd.exe /c exit 0

      - name: Configure DART
        # Default MSVC Release flags omit /Zi, so sccache can cache objects.
        # Disable pybind11's implicit /GL and /LTCG as well as DART's tuning.
        run: pixi run config -- -DDART_MSVC_DEFAULT_OPTIONS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      - name: Check Lint
        run: pixi run check-lint

      - name: Test DART and dartpy
        run: pixi run test-all

      # Cache keys are immutable: publish at most one successful main snapshot
      # per UTC day/configuration, including after a prefix-only restore.
      - name: Save sccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

      - name: Sccache statistics
        if: always()
        run: pixi run sccache --show-stats

      # Linux CI covers install. On Windows, pixi run install configures a
      # separate install build tree after test-all has already passed, which
      # duplicates work and can keep the protected-branch runner busy for hours.
