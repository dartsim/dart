# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: API Documentation

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # the release lines so PR branches are not built twice per push.
    branches:
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  # Nightly (nightly.yml) runs this workflow on release-6.20 every night.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected release branches should finish every post-merge validation run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ startsWith(github.ref, 'refs/heads/release-')
        && format('api-doc-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('api-doc-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/heads/release-') }}

jobs:
  build:
    name: API Documentation
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: "2"

      # Validation only: build this checkout's Doxygen docs; nothing is
      # published. scripts/build_docs.sh builds the released versions instead.
      - name: Build API docs
        run: |
          pixi run config
          pixi run -- cmake --build "build/default/cpp/$BUILD_TYPE" --target docs
