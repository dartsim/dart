# https://docs.github.com/en/code-security/code-scanning/introduction-to-code-scanning/about-codeql

name: CodeQL

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/update_lockfiles.yml"
      - ".readthedocs.yml"
      - "tutorials/**"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.po"
      - "**/*.pot"
  pull_request:
    branches:
      - "main"
    # Pull requests run the Python analysis only, and .github/codeql/config.yml
    # limits it to these trees, so a PR that changes none of them would only
    # re-analyze code that main already scanned.
    paths:
      - "dart/**/*.py"
      - "python/**/*.py"
      - "tests/**/*.py"
      - "examples/**/*.py"
      - "tutorials/**/*.py"
      - "docs/**/*.py"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1" # Weekly on Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # Preserve scheduled/manual evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch')
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch' }}

jobs:
  analyze:
    name: Security | CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DART_VERBOSE: ON
      # The CodeQL C++ extractor traces the compiler processes of the manual
      # build. A compiler cache hides them: sccache hits skip the compiler
      # entirely and misses run it inside the detached sccache server, outside
      # the tracer's process tree, so the database would come out empty.
      # cmake/compiler_cache.cmake honors this flag and leaves the launcher
      # variables unset.
      DART_DISABLE_COMPILER_CACHE: "ON"
    strategy:
      fail-fast: false
      # The C++ analysis needs a manual Debug build plus CodeQL database
      # extraction (~100 min), which is too heavy to repeat on every PR push.
      # It runs on main pushes, the weekly schedule, and manual dispatch;
      # scanning main right after merge keeps alert coverage without gating PR
      # feedback. The Python analysis (build-mode: none) is cheap and stays on
      # PRs. The matrix is selected by event here instead of by a separate
      # matrix-emitting job.
      matrix: >-
        ${{ github.event_name == 'pull_request'
            && fromJSON('{"include":[{"language":"python","build_mode":"none","run_build":false}]}')
            || fromJSON('{"include":[{"language":"cpp","build_mode":"manual","run_build":true},{"language":"python","build_mode":"none","run_build":false}]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Debug build plus the CodeQL database is the largest tree CI
      # produces; reclaim the preinstalled toolchains before building.
      - name: Free disk space
        if: matrix.run_build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup pixi (CI)
        if: matrix.run_build
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          enable-sccache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          config-file: ./.github/codeql/config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          # The C++ TRAP cache is ~3 GB per entry and two entries consumed
          # 6 GB of the repository's 10 GB Actions cache, starving the
          # compiler cache every PR depends on. The analysis runs on main
          # pushes and the weekly schedule only, so the incremental TRAP
          # benefit does not justify the budget.
          trap-caching: false

      - name: Configure (CMake)
        if: matrix.run_build
        env:
          DART_BUILD_GUI_OVERRIDE: "OFF"
        run: |
          pixi run config OFF Debug

      - name: Build
        if: matrix.run_build
        env:
          DART_BUILD_GUI_OVERRIDE: "OFF"
          DART_PARALLEL_JOBS: "2"
        run: |
          pixi run python scripts/cmake_build.py \
            --build-dir build/default/cpp/Debug \
            --target dart_component_dart \
            --target dart-collision-native \
            --target dart-io \
            --target dart-simulation \
            --target dartsim_engine

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: sarif-results
          upload: failure-only

      - name: Filter external dependency alerts
        run: |
          shopt -s nullglob
          sarif_files=(sarif-results/*.sarif)

          if (( ${#sarif_files[@]} == 0 )); then
            echo "No CodeQL SARIF files found." >&2
            exit 1
          fi

          for sarif in "${sarif_files[@]}"; do
            tmp="${sarif}.tmp"
            jq '
              def primary_uri:
                .locations[0].physicalLocation.artifactLocation.uri // "";

              def generated_or_dependency_path:
                gsub("\\\\"; "/")
                | (
                  test("(^|/)(\\.pixi|build|dist|\\.cache)(/|$)")
                  or test("(^|/)(third-party|external)(/|$)")
                );

              (.runs[]?.results) |= ((. // []) | map(
                select(
                  (primary_uri | generated_or_dependency_path)
                  | not
                )
              ))
            ' "$sarif" > "$tmp"
            mv "$tmp" "$sarif"
          done

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results
          wait-for-processing: "true"
