# Published PR text is permanent; keep private and machine-specific paths out
# of it. Title and description edits rerun only this check, not CI.
name: PR Text

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  local-paths:
    name: No local paths in PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Use only trusted base code so PR changes cannot bypass this guard.
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/check_local_paths.py
          sparse-checkout-cone-mode: false

      - name: Check PR title, body and commit messages
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/check_local_paths.py ]; then
            echo "::notice::Base branch has no local-path checker yet; skipping PR text check."
            exit 0
          fi
          scan_status=0
          if ! printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check_local_paths.py --stdin; then
            echo "::error::PR title/body local-path scan failed."
            scan_status=1
          fi
          # The commits endpoint lists at most 250 commits; fail closed beyond.
          if [ "$PR_COMMITS" -gt 250 ]; then
            echo "::error::PR has $PR_COMMITS commits; only 250 commit messages can be listed and scanned."
            scan_status=1
          elif ! gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" --jq '.[].commit.message' | python3 scripts/check_local_paths.py --stdin; then
            echo "::error::PR commit-message local-path scan failed."
            scan_status=1
          fi
          exit "$scan_status"
