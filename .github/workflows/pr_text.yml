# Published PR text is permanent; keep private and machine-specific paths out
# of it. Title and description edits rerun only this check, not CI.
name: PR Text

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  local-paths:
    name: No local paths in PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Use only trusted base code so PR changes cannot bypass this guard.
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/check_local_paths.py
          sparse-checkout-cone-mode: false

      - name: Check PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f scripts/check_local_paths.py ]; then
            echo "::notice::Base branch has no local-path checker yet; skipping PR text check."
            exit 0
          fi
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check_local_paths.py --stdin
