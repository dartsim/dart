# Published PR text is permanent; keep private and machine-specific paths out
# of it. Rebase merges can publish every PR commit, including removed leaks.
# Fetch PR objects for scanning; never check out or execute PR code.
# Title and description edits rerun only this check, not CI.
# Once this workflow is on main, the maintainer should add
# "No local paths in PR text" to the main ruleset's required checks.
# GitHub may not trigger pull_request_target for SHA-like branch names;
# those PRs rely on CI's tracked-file scan and review.
name: PR Text

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  local-paths:
    name: No local paths in PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Use only trusted base code so PR changes cannot bypass this guard.
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/check_local_paths.py
          sparse-checkout-cone-mode: false

      - name: Check PR title, body, commit messages and changes
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/check_local_paths.py ]; then
            echo "::notice::Base branch has no local-path checker yet; skipping PR text check."
            exit 0
          fi
          scan_status=0
          if ! printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check_local_paths.py --stdin; then
            echo "::error::PR title/body local-path scan failed."
            scan_status=1
          fi
          # The commits endpoint lists at most 250 commits; fail closed beyond.
          if [ "$PR_COMMITS" -gt 250 ]; then
            echo "::error::PR has $PR_COMMITS commits; only 250 commit messages can be listed and scanned."
            scan_status=1
          elif ! gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" --jq '.[].commit.message' | python3 scripts/check_local_paths.py --stdin; then
            echo "::error::PR commit-message local-path scan failed."
            scan_status=1
          fi
          if ! git fetch --no-tags origin "$BASE_SHA" "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"; then
            echo "::error::PR commit-change fetch failed."
            scan_status=1
          elif ! python3 scripts/check_local_paths.py --commit-range "$BASE_SHA..refs/remotes/pr/head"; then
            echo "::error::PR commit-change local-path scan failed."
            scan_status=1
          fi
          exit "$scan_status"
