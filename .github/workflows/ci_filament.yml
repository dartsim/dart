name: CI Filament

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly-only Windows leg"
        type: boolean
        default: false
  # Nightly (nightly.yml) calls this with `nightly: true` every night.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-filament-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional:
    name: ${{ matrix.runner }}-Filament-functional
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15]
        exclude:
          # Nightly only: the Windows leg compiles without a compiler cache for
          # 20-30 minutes, and CI Windows builds the GUI on every PR.
          - runner: ${{ !inputs.nightly && 'windows-2022' || '' }}
    env:
      CMAKE_GENERATOR: Ninja
      # MSVC single-config builds otherwise default to Debug.
      CMAKE_BUILD_TYPE: Release
      DART_MSVC_DISABLE_WHOLE_PROGRAM_OPTIMIZATION: "ON"
      LIBGL_ALWAYS_SOFTWARE: "1"
      # `pixi run config` builds the GUI and dartpy; Windows uses its own task.
      BUILD_DIR: ${{ matrix.runner == 'windows-2022' && 'build/gui-ci/cpp' || 'build/gui-ci/cpp/Release' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set parity output directory
        shell: bash
        run: echo "DART_FILAMENT_PARITY_DIR=$RUNNER_TEMP/filament-parity" >> "$GITHUB_ENV"
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: "2022"
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: gui-ci
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Linux software graphics
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1
          echo "VK_DRIVER_FILES=$GITHUB_WORKSPACE/.pixi/envs/gui-ci/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
      # As in CI Windows, default MSVC options drop DART's /Zi so parallel
      # sccache compiles do not share a program database.
      - name: Configure Filament
        run: >-
          pixi run -e gui-ci config -- -DDART_ENABLE_GUI_SMOKE_TESTS=ON
          ${{ runner.os == 'Windows' && '-DDART_MSVC_DEFAULT_OPTIONS=ON' || '' }}
      - name: Build GUI tests and bindings
        run: >-
          pixi run -e gui-ci cmake --build ${{ env.BUILD_DIR }} --parallel 4
          --target test_GuiDescriptors test_GuiInteractions test_GuiImageDecoders test_GuiViewer test_GuiParity test_GuiMesh test_FilamentBackend offscreen_capture_smoke dartpy
          test_GuiApp test_GuiAppMemoryDiagnostics test_GuiAppMemoryDiagnosticsModel test_Issue2671
      - name: Windows isolated software WGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE '.pixi/envs/gui-ci'
          $runtime = Join-Path $prefix 'Library/bin'
          $directories = @($prefix,
            (Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/bin"),
            (Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/tests/integration"),
            (Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/tests/benchmark/integration"))
          foreach ($directory in $directories) {
            foreach ($library in @('opengl32.dll', 'libgallium_wgl.dll')) {
              Copy-Item (Join-Path $runtime $library) (Join-Path $directory $library) -Force -ErrorAction Stop
            }
          }
      - name: Linux display-free Vulkan capture
        if: runner.os == 'Linux'
        run: >-
          env -u DISPLAY -u WAYLAND_DISPLAY pixi run -e gui-ci ctest
          --test-dir ${{ env.BUILD_DIR }} --output-on-failure
          --no-tests=error -R '^(test_GuiApp|test_GuiAppMemoryDiagnostics.*|test_FilamentBackend|test_GuiParity|test_GuiMesh|test_GuiImageDecoders|test_Issue2671$)'
      - name: Linux native window and capture
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24' pixi run -e gui-ci ctest --test-dir ${{ env.BUILD_DIR }}
          --output-on-failure --no-tests=error -R '^(test_Gui(Descriptors|Interactions|Viewer)$|test_FilamentNative|offscreen_capture_smoke)'
      - name: Windows and macOS native GUI tests
        if: runner.os != 'Linux'
        run: >-
          pixi run -e gui-ci ctest --test-dir ${{ env.BUILD_DIR }}
          --output-on-failure --no-tests=error -R '^(test_Gui|test_FilamentBackend|test_FilamentNative|offscreen_capture_smoke|test_Issue2671$)'
      - name: Python GUI and real capture
        run: >-
          pixi run -e gui-ci python -I scripts/run_pytest.py
          --pythonpath ${{ env.BUILD_DIR }}/python
          python/tests/unit/gui python/tests/integration -q
      - name: Relocated C++17 GUI consumer
        run: pixi run -e gui-ci python scripts/test_gui_install.py ${{ env.BUILD_DIR }}
      - name: Preserve graphics diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filament-${{ matrix.runner }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/dart/gui/filament_generated/*.filamat
            ${{ runner.temp }}/filament-parity

  # Real NVIDIA Vulkan coverage on one resource-capped self-hosted runner. The
  # runner group is restricted server-side to this file on main; the `if` is
  # defense in depth and never lets PR or fork code reach the runner.
  hardware:
    name: nvidia-Filament-hardware
    if: >-
      github.repository == 'dartsim/dart' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: dart-gpu-trusted
      labels: dart-gpu-nvidia
    timeout-minutes: 240
    # Per-job group: workflow-level cancellation never interrupts GPU work.
    concurrency:
      group: ci-filament-gpu
      cancel-in-progress: false
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: Release
      BUILD_DIR: build/gui-ci/cpp/Release
      GPU_OUT: ${{ github.workspace }}/build/gpu-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the NVIDIA GPU
        run: |
          set -euo pipefail
          mkdir -p "$GPU_OUT"
          unset DISPLAY WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE VK_ICD_FILENAMES VK_LOADER_DRIVERS_SELECT
          nvidia-smi -q > "$GPU_OUT/nvidia-smi.txt"
          env | grep -E '^(VK_|NVIDIA_|LIBGL_|DISPLAY|WAYLAND_DISPLAY)' > "$GPU_OUT/env.txt" || true
          nvidia-smi --query-gpu=name --format=csv,noheader > "$GPU_OUT/gpu_name.txt"
          test "$(wc -l < "$GPU_OUT/gpu_name.txt")" -eq 1 || { echo "expected exactly one NVIDIA GPU" >&2; exit 1; }
          test -r "${VK_DRIVER_FILES:-}" || { echo "NVIDIA Vulkan driver file is not readable" >&2; exit 1; }
      - name: Install Pixi environment
        run: pixi install -e gui-ci --locked
      - name: Configure Filament
        run: >-
          env -u DISPLAY -u WAYLAND_DISPLAY -u LIBGL_ALWAYS_SOFTWARE
          pixi run -e gui-ci config -- -DDART_ENABLE_GUI_SMOKE_TESTS=ON
      - name: Build hardware tests and bindings
        run: >-
          pixi run -e gui-ci cmake --build ${{ env.BUILD_DIR }} --parallel 4
          --target test_FilamentBackend test_GuiParity test_GuiMesh dartpy
      - name: NVIDIA headless Vulkan tests
        run: >-
          env -u DISPLAY -u WAYLAND_DISPLAY -u LIBGL_ALWAYS_SOFTWARE
          -u VK_ICD_FILENAMES -u VK_LOADER_DRIVERS_SELECT
          pixi run -e gui-ci ctest --test-dir ${{ env.BUILD_DIR }}
          --output-on-failure --no-tests=error -R '^(test_FilamentBackend|test_GuiParity|test_GuiMesh)$'
      - name: NVIDIA agent capture
        # Direct python (not `pixi run agent-capture`) avoids its build-py-dev rebuild.
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE VK_ICD_FILENAMES VK_LOADER_DRIVERS_SELECT
          export PYTHONPATH="$PWD/$BUILD_DIR/python:$PWD/scripts:$PWD/python"
          pixi run -e gui-ci python scripts/agent_capture.py --scene box_on_ground --steps 250 \
            --focus box --layers contacts collision_bounds --auto-views 1 \
            --out "$GPU_OUT/capture" --prefix gpu
          shopt -s nullglob
          pngs=("$GPU_OUT"/capture/gpu_*.png)
          test "${#pngs[@]}" -ge 1 || { echo "capture wrote no PNG" >&2; exit 1; }
          for png in "${pngs[@]}"; do
            pixi run -e gui-ci python scripts/image_verdict.py "$png" | tee "$png.verdict.json"
          done
      - name: Verify the renderer is the NVIDIA GPU
        run: |
          pixi run -e gui-ci python -I - "$GPU_OUT/capture/gpu_capture.json" "$GPU_OUT/gpu_name.txt" "$GPU_OUT/capture"/gpu_*.png.verdict.json <<'PY'
          import json, sys
          from pathlib import Path
          capture = json.loads(Path(sys.argv[1]).read_text())
          expected = Path(sys.argv[2]).read_text().strip()
          if capture["graphics_backend"].lower() != "vulkan":
              raise SystemExit(f"backend is {capture['graphics_backend']!r}, expected vulkan")
          if capture["graphics_device"] != expected:
              raise SystemExit(f"renderer {capture['graphics_device']!r} != nvidia-smi {expected!r}")
          for path in sys.argv[3:]:
              if not json.loads(Path(path).read_text())["pass"]:
                  raise SystemExit(f"image-verdict failed: {path}")
          print(f"verified {expected}")
          PY
      - name: Preserve hardware diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filament-nvidia
          path: |
            ${{ env.GPU_OUT }}
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
