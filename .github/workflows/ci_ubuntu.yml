# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI Linux

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly-only jobs"
        type: boolean
        default: false
  # Nightly (nightly.yml) calls this with `nightly: true` every night.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-linux-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-linux-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  ai-infrastructure:
    name: AI infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      # check-ai-commands and check-ai-infra run in the Release job's
      # check-lint; test-ai-infra also exercises the agent scenarios.
      - name: Test AI infrastructure
        run: pixi run test-ai-infra

  coverage:
    # Nightly only; codecov tracks main from the nightly upload.
    if: inputs.nightly
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: "2"

      - name: Build with coverage
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run build-coverage

      - name: Generate coverage report
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run --skip-deps coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: unittests
          name: codecov-umbrella
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  # pixi tasks pin BUILD_TYPE=Release, so a BUILD_TYPE=Debug leg would only
  # rebuild Release; the nightly coverage job is the Debug build.
  build:
    name: Release
    runs-on: ubuntu-latest
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      # Compiler cache: restored on every run, saved from main at most once a
      # day per configuration (the repository's Actions cache is 10 GB).
      - name: Restore compiler cache
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"
          echo "SCCACHE_DAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-linux-Release-${{ env.SCCACHE_DAY }}
          restore-keys: sccache-linux-Release-

      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev xvfb
          version: "2"

      - name: Check Lint
        run: |
          DART_VERBOSE=ON \
          pixi run check-lint

      - name: Test DART and dartpy
        run: |
          DART_VERBOSE=ON \
          pixi run test-all

      - name: Agent visual verification smoke
        run: |
          rm -rf /tmp/dart-agent-visual-smoke
          xvfb-run -a -s '-screen 0 640x480x24' \
            bash -eu -o pipefail <<'VISUAL_SMOKE'
          pixi run agent-capture -- \
              --scene box_on_ground --steps 250 --focus box --auto-views 1 \
              --layers contacts collision_bounds labels \
              --width 320 --height 240 \
              --out /tmp/dart-agent-visual-smoke --prefix smoke
          pixi run image-verdict -- \
            /tmp/dart-agent-visual-smoke/smoke_auto0.png
          pixi run agent-capture -- \
              --scene dart_shape_contacts --steps 500 \
              --camera-azimuth 1.5708 --camera-elevation 0.35 \
              --camera-distance 4.5 --camera-target 0 0 0.2 \
              --layers contacts collision_bounds labels \
              --width 640 --height 480 \
              --out /tmp/dart-agent-visual-smoke --prefix dart
          pixi run image-verdict -- \
            /tmp/dart-agent-visual-smoke/dart_main.png
          VISUAL_SMOKE
          xvfb-run -a -s '-screen 0 640x480x24' \
            pixi run test-agent-debug-overlay

      - name: Upload agent visual verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-visual-smoke
          path: /tmp/dart-agent-visual-smoke
          if-no-files-found: error

      - name: Test with AddressSanitizer
        # Nightly only: a second full build (~1 h) on the shared runner fleet.
        if: inputs.nightly
        run: |
          DART_VERBOSE=ON \
          pixi run test-asan

      - name: Install
        run: |
          DART_VERBOSE=ON \
          pixi run install

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-linux-Release-${{ env.SCCACHE_DAY }}

  # Catch compile and test failures when assertions are enabled outside a Debug
  # build type (e.g., downstream builds that drop -DNDEBUG in Release).
  build-asserts:
    name: Asserts enabled (no -DNDEBUG)
    runs-on: ubuntu-latest
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      # Compiler cache: restored on every run, saved from main at most once a
      # day per configuration (the repository's Actions cache is 10 GB).
      - name: Restore compiler cache
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"
          echo "SCCACHE_DAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-linux-asserts-${{ env.SCCACHE_DAY }}
          restore-keys: sccache-linux-asserts-

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: "2"

      - name: Build and test with assertions (no -DNDEBUG)
        run: |
          # NOTE: pixi tasks set BUILD_TYPE internally, so we
          # configure this variant explicitly to ensure NDEBUG is not defined.
          pixi run -- bash -lc '
            set -euo pipefail
            BUILD_TYPE=None
            DART_VERBOSE=ON
            # DART 6 dartpy requires dart-gui-osg, so this required variant
            # runs the C++ tests with assertions and validates the no-OSG
            # contract. -O2 keeps NDEBUG undefined; at -O0 the tests take hours.
            cmake \
              -G Ninja \
              -S . \
              -B build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE \
              -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_FLAGS=-O2 \
              -DCMAKE_CXX_FLAGS=-O2 \
              -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSceneGraph=TRUE \
              -DDART_BUILD_DARTPY=OFF \
              -DDART_BUILD_GUI_OSG=OFF \
              -DDART_BUILD_PROFILE=ON \
              -DDART_USE_SYSTEM_GOOGLEBENCHMARK=ON \
              -DDART_USE_SYSTEM_GOOGLETEST=ON \
              -DDART_USE_SYSTEM_IMGUI=ON \
              -DDART_USE_SYSTEM_TRACY=ON \
              -DDART_VERBOSE=$DART_VERBOSE
            cmake --build build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE -j --target ALL
          '

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-linux-asserts-${{ env.SCCACHE_DAY }}

  eigen-overalignment:
    name: Eigen 64-byte alignment
    if: inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: "2"

      - name: Build and test with Eigen over-alignment
        run: |
          DART_VERBOSE=ON \
          pixi run test-eigen-overalignment
