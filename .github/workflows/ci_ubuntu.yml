# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#
# Tiers (docs/onboarding/ci-cd.md, "CI Tiering Policy"):
# - pull_request: Coverage (Debug), Release Tests (+ headless demo and GUI
#   smoke), Differentiable Build, Debug Tests, Asserts enabled, Visual
#   Verification; all gated on the shared code filter.
# - main/release pushes, schedule, workflow_dispatch: the PR tier plus ASAN
#   Tests, Eigen 64-byte alignment, DART GUI Smoke (Clang); the Collision
#   Benchmark Guard runs on schedule and dispatch only.
# Every Linux job starts with checkout plus the setup-dart-linux-ci composite
# (disk reclaim where needed, pixi + sccache, apt, compiler-cache guard). The
# jobs run on GitHub-hosted runners only; the self-hosted GPU runner keeps its
# own workspace-clean step in ci_cuda.yml.

name: CI Linux

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  schedule:
    # Weekly drift canary (runner images, floating action majors); main
    # receives several validated pushes a week, so twice-weekly repeated
    # nothing new. Offset from ci_windows (02:20) and ci_macos (02:40).
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch')
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # dorny/paths-filter lists changed files through the pull-request API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # PR events list files through the API; push events fetch the `before`
      # commit on demand, so a full-history clone is not needed here.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters/ci-code.yml
          # Required so the `!` exclusions in the filter file act as excludes.
          predicate-quantifier: some-with-excludes

  coverage:
    needs: changes
    # Schedule and manual runs carry no file-change payload; run unconditionally.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Coverage (Debug)
    runs-on: ubuntu-latest
    # Instrumented Debug build + parallel lcov capture; ~65 min with the cache
    # off, ~40 min warm (ctest and lcov dominate). Sized well below the ~6h
    # default kill.
    timeout-minutes: 180
    env:
      # The Debug + --coverage build instruments every translation unit, using
      # materially more memory than a normal build; eight parallel jobs starve
      # the hosted runner ("lost communication with the server"). Keep
      # parallelism lower to avoid OOM kills (cf. the ASAN build below).
      DART_PARALLEL_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The instrumented object files (debug info + gcov arcs) are several
      # times larger than a normal build and do not fit next to the
      # preinstalled toolchains.
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci
        with:
          free-disk-space: "true"

      - name: Build and generate coverage report
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: unittests
          name: codecov-umbrella
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  build-release:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Release Tests
    runs-on: ubuntu-latest
    # Build-bound (Release build + dartpy + examples + install). The headless
    # demo check runs on the dart-demos binary the `examples` target built, and
    # the dartsim GUI smoke builds the (EXCLUDE_FROM_ALL) dartsim app on the
    # same tree, so neither needs the separate Release builds they used to
    # have. Cold ~93 min; warm ~14 min.
    timeout-minutes: 150
    env:
      DART_PARALLEL_JOBS: 8
      # ctest itself takes well under a minute; keep parallel ctest for the
      # few long-pole tests. The job is build-bound.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Run Release C++ tests
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run test ON Release

      - name: Run default differentiable OFF parity test
        run: |
          pixi run -- cmake --build build/default/cpp/Release \
            --target test_diff_zero_cost_parity \
            --parallel "${DART_PARALLEL_JOBS}"
          pixi run python -I scripts/ctest_tier.py \
            --build-type Release \
            -R '^test_diff_zero_cost_parity$'

      - name: Run Release Python tests
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run test-py ON Release

      - name: Build Release examples
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run build-examples ON Release

      - name: Run headless rendering test (rigid_body)
        run: |
          mkdir -p /tmp/headless_output
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            ./build/default/cpp/Release/bin/dart-demos \
            --scene rigid_body \
            --headless --frames 10 \
            --screenshot /tmp/headless_output/rigid_body.ppm
          echo "Captured image:"
          ls -la /tmp/headless_output/
          test -f /tmp/headless_output/rigid_body.ppm
          test "$(head -c 2 /tmp/headless_output/rigid_body.ppm)" = "P6"
          echo "Headless rendering test passed!"

      - name: Run DART GUI smoke (dartsim)
        # scripts/run_cpp_example.py reconfigures this tree with the GUI smoke
        # tests enabled (DART_ENABLE_GUI_FILAMENT_SMOKE_TESTS) and tutorials
        # off, builds the dartsim target, and runs the headless smoke entries
        # under xvfb. It runs after the C++/Python tests on purpose: enabling
        # the smoke option earlier would register offscreen-render tests into
        # the plain ctest pass, which has no display. The pixi task's
        # dartpy-OFF override is not used, so dartpy stays configured.
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            pixi run python scripts/run_cpp_example.py dartsim --pixi-smoke

      - name: Install
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run install

  build-diff:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Differentiable Build (DART_BUILD_DIFF=ON)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_TYPE: Release
      DART_PARALLEL_JOBS: 8
      CTEST_PARALLEL_LEVEL: 4
      DART_BUILD_DIFF_OVERRIDE: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Configure differentiable build
        run: |
          DART_VERBOSE=ON pixi run config ON Release

      - name: Build differentiable targets
        run: |
          pixi run -- cmake --build build/default/cpp/Release \
            --target \
              dartpy \
              test_diff_zero_cost_parity \
              test_diff_smooth_jacobian \
              test_diff_contact_jacobian \
              test_diff_public_contact_jacobian \
              test_diff_contact_gradient_modes \
              test_diff_apply_step_vjp \
              test_diff_parameter_jacobian \
              test_diff_rollout \
              test_diff_optimization \
              test_diff_paper_experiments \
              test_diff_dojo_style_ipm_spike \
            --parallel "${DART_PARALLEL_JOBS}"

      - name: Run differentiable C++ tests
        run: |
          pixi run python -I scripts/ctest_tier.py \
            --build-type Release \
            -R '^test_diff_'

      - name: Run differentiable Python tests
        run: |
          DARTPY_RUNTIME_DIR=build/default/cpp/Release \
          pixi run python -I scripts/run_pytest.py \
            --pythonpath build/default/cpp/Release/python \
            --pythonpath build/default/cpp/Release/python/dartpy \
            --repository-conftest \
            python/tests/unit/simulation/test_diff.py -q

  build-asan:
    needs: changes
    # The ASAN suite is compile-dominated: ~2h to build the instrumented tree
    # for ~2min of ctest. That cost gates no PR-local signal worth 2h per
    # push, so it runs as continuous coverage on protected branch pushes, the
    # scheduled runs, and manual dispatch. Need ASAN evidence on a branch
    # before merge? Trigger this workflow via workflow_dispatch on the branch.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true')
    name: ASAN Tests
    runs-on: ubuntu-latest
    # Sized above the observed ~2h cold build so a genuine hang still fails
    # well before the ~6h default kill.
    timeout-minutes: 210
    env:
      # ASAN builds use materially more memory than a normal Release build;
      # keep parallelism lower to avoid hosted-runner OOM kills.
      DART_PARALLEL_JOBS: 4
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The instrumented ASAN tree keeps sanitizer metadata and debug info for
      # every test target.
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci
        with:
          free-disk-space: "true"

      - name: Build and test with AddressSanitizer
        run: |
          DART_VERBOSE=ON \
          pixi run test-asan

  collision-benchmark-guard:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Collision Benchmark Guard
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUILD_TYPE: Release
      DART_PARALLEL_JOBS: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci
        with:
          environments: collision-reference
          install-args: -e collision-reference

      - name: Run collision benchmark guard
        run: |
          pixi run --locked -e collision-reference bm-collision-check

      - name: Upload collision benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collision-benchmark-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark_results/collision_check_*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  build-debug:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Debug Tests
    runs-on: ubuntu-latest
    # The dominant cost is the Debug build of the C++ test executables at two
    # parallel jobs (memory-bound, see below); ctest takes ~3 min and the
    # dartpy Debug build ~2 min warm. Each step sets DART_PARALLEL_JOBS
    # itself. Generous cold-cache cap.
    timeout-minutes: 210
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The Debug build keeps full debug info for every test executable and
      # can exhaust the hosted runner before the final test links complete.
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci
        with:
          free-disk-space: "true"

      - name: Run Debug C++ tests
        run: |
          # The Debug compile of the simulation test executables (the rigid
          # AVBD kernel headers are instantiated in a dozen large TUs) peaks
          # above the 16 GB hosted runner's memory at the default four jobs:
          # the runner service was shut down mid-build in three consecutive
          # runs. Two jobs keep the peak inside the limit.
          export DART_PARALLEL_JOBS=2
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run test ON Debug

      - name: Run Debug Python tests
        run: |
          # This step builds the dartpy nanobind extension. In Debug each
          # binding TU is large, so keep parallelism below the 16 GB hosted
          # runner's memory limit. Request mold for the final Debug module link
          # when it is present; CMake falls back to the default linker if the
          # runner image does not provide it. Keep this as a Debug dartpy smoke
          # path; Release and wheel jobs run the full Python suite.
          export DART_USE_MOLD_OVERRIDE=ON
          export DART_VERBOSE=ON
          export DART_PARALLEL_JOBS=4
          pixi run build-py-dev ON Debug
          pixi run python -I scripts/run_pytest.py \
            --pythonpath build/default/cpp/Debug/python \
            --pythonpath build/default/cpp/Debug/python/dartpy \
            --repository-conftest \
            python/tests/unit/common/test_string.py \
            python/tests/unit/math/test_lcp.py \
            python/tests/unit/test_lifetime.py \
            -vv --tb=short

  build-asserts:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Asserts enabled (no -DNDEBUG)
    runs-on: ubuntu-latest
    # Build-only: the one CI build that compiles with -Werror while DART_ASSERT
    # bodies are live (CMAKE_BUILD_TYPE=None), exercises the fetched Tracy
    # client, and compiles examples and dartpy in that mode. ~2 min warm.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Build with assertions and Tracy profiling (no -DNDEBUG)
        run: |
          # NOTE: pixi tasks set BUILD_TYPE internally, so configure this
          # variant explicitly to ensure NDEBUG is not defined. This also
          # smoke-tests the fetched Tracy client path without installing Tracy
          # through Pixi package dependencies.
          pixi run -- bash -lc '
            set -euo pipefail
            BUILD_TYPE=None
            DART_VERBOSE=ON
            eval "HOST_LINKER_DEFS=($(python scripts/cmake_host_linker_flags.py))"
            cmake \
              -G Ninja \
              -S . \
              -B build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE \
              -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
              -DDART_BUILD_DARTPY=ON \
              -DDART_BUILD_COLLISION_REFERENCE_TESTS=OFF \
              -DDART_BUILD_COLLISION_REFERENCE_BENCHMARKS=OFF \
              -DDART_BUILD_PROFILE=ON \
              -DDART_PROFILE_TRACY=ON \
              -DDART_USE_SYSTEM_GOOGLEBENCHMARK=ON \
              -DDART_USE_SYSTEM_GOOGLETEST=ON \
              -DDART_USE_SYSTEM_IMGUI=ON \
              -DDART_USE_SYSTEM_TRACY=OFF \
              -DDART_VERBOSE=$DART_VERBOSE \
              ${HOST_LINKER_DEFS[@]+"${HOST_LINKER_DEFS[@]}"}
            cmake --build build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE -j
          '

  eigen-overalignment:
    needs: changes
    # Continuous tier: the 64-byte Eigen alignment contract fails only on
    # allocator, placement-new, or storage mistakes, which have not been
    # PR-local in the recorded history; every main push still runs it, and
    # workflow_dispatch on a branch provides pre-merge evidence when needed.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true')
    name: Eigen 64-byte alignment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DART_PARALLEL_JOBS: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Build and test with Eigen over-alignment
        run: |
          DART_VERBOSE=ON \
          pixi run test-eigen-overalignment

  visual-verification:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    name: Visual Verification (ImGui docking)
    runs-on: ubuntu-latest
    # Builds only the Release-docking dartpy tree (DART_USE_SYSTEM_IMGUI=OFF,
    # the fetched ImGui docking branch), which is a genuinely different
    # configuration from the Release Tests tree; the headless demo check that
    # used to rebuild examples here now runs in Release Tests.
    timeout-minutes: 120
    env:
      DART_PARALLEL_JOBS: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Agent visual verification smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          rm -rf /tmp/dart-agent-visual-smoke
          xvfb-run -a -s '-screen 0 640x480x24' \
            pixi run agent-capture -- \
              --scene box_on_ground --steps 250 --focus box --auto-views 1 \
              --layers contacts collision_bounds labels \
              --width 320 --height 240 \
              --out /tmp/dart-agent-visual-smoke --prefix smoke
          pixi run image-verdict -- \
            /tmp/dart-agent-visual-smoke/smoke_auto0.png
          xvfb-run -a -s '-screen 0 640x480x24' \
            env DART_REQUIRE_VISUAL_E2E=1 pixi run test-agent-visual-e2e

  filament-gui-smoke:
    needs: changes
    # Continuous tier: the only Linux build with the system clang (and its
    # libstdc++ concepts workaround). The default-toolchain GUI smoke runs in
    # Release Tests on every PR; macOS covers clang on every PR as well.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true')
    name: DART GUI Smoke (Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DART_PARALLEL_JOBS: 2
      CC: clang
      CXX: clang++
      # Clang 18 reports __cpp_concepts=201907L, but libstdc++ 14 gates
      # std::expected (and other C++20/23 library features) behind
      # __cpp_concepts>=202002L, so std::expected is hidden and the build
      # fails (dart/common/result.hpp). Advertise the final C++20 concepts
      # value so libstdc++ exposes <expected>. This keeps the build on
      # libstdc++ -- ABI-matching the conda deps -- unlike -stdlib=libc++.
      CXXFLAGS: "-D__cpp_concepts=202002L -Wno-builtin-macro-redefined"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci
        with:
          apt-packages: clang libgl1-mesa-dev libglu1-mesa-dev mesa-utils xvfb

      - name: Build and run DART GUI smoke tests
        run: |
          DART_VERBOSE=ON \
          pixi run test-dart-gui-smoke
