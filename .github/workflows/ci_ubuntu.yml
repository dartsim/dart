# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI Linux

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    types: [opened, synchronize, reopened, edited, milestoned, demilestoned]
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly-only jobs"
        type: boolean
        default: false
  # Nightly (nightly.yml) calls this with `nightly: true` every night.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-linux-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-linux-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  ai-infrastructure:
    name: AI infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      # check-ai-commands and check-ai-infra run in the Release job's
      # check-lint; test-ai-infra also exercises the agent scenarios.
      - name: Check tracked files for local paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checker=scripts/check_local_paths.py
          # A PR cannot weaken the checker that judges it.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git show "$BASE_SHA:scripts/check_local_paths.py" > "$RUNNER_TEMP/check_local_paths.py"; then
              checker="$RUNNER_TEMP/check_local_paths.py"
            else
              echo "::notice::Base commit has no local-path checker yet; using the tree's checker."
            fi
          fi
          python3 "$checker" --all-tracked

      - name: Test AI infrastructure
        run: pixi run test-ai-infra

      - name: Test wheel tooling
        run: pixi run test-wheel-tooling

      - name: Test the performance regression harness
        run: pixi run test-perf-regression

  build-requirements:
    # CI Windows runs these CMake probes nightly, where they take 15-30 minutes
    # per job.
    name: Build requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Check build requirements
        run: pixi run test-build-requirements

  fetched-test-tooling:
    name: Fetched test tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write # Save compiler cache prunes superseded snapshots.
      contents: read
    env:
      SCCACHE_CACHE_SIZE: "900M"
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Restore compiler cache
        uses: ./.github/actions/sccache
        with:
          phase: restore
          os: linux
          part: FetchedTestTooling

      - name: Configure fetched test tooling
        run: |
          set -o pipefail
          pixi run config -- -DCMAKE_UNITY_BUILD=ON \
            -DDART_BUILD_GUI=OFF -DDART_BUILD_DARTPY=OFF \
            -DDART_USE_SYSTEM_GOOGLETEST=OFF \
            -DDART_USE_SYSTEM_GOOGLEBENCHMARK=OFF 2>&1 \
            | tee "$RUNNER_TEMP/fetched-config.log"
          # Benchmark must report its archive's version, not DART's Git tag.
          grep -F "Google Benchmark version: v1.10.0" "$RUNNER_TEMP/fetched-config.log"

      - name: Build tests and benchmarks
        id: build
        run: |
          pixi run cmake --build build/default/cpp/Release \
            --target tests tests/benchmark/all -j 4

      - name: Run tests
        run: pixi run ctest --test-dir build/default/cpp/Release --output-on-failure -LE gui-device

      - name: Check installed files
        run: |
          prefix="$RUNNER_TEMP/fetched-test-tooling-install"
          pixi run cmake --install build/default/cpp/Release --prefix "$prefix"
          # DART's own examples and model data include benchmark filenames.
          installed="$(find "$prefix" -path "$prefix/share/doc/dart" -prune -o \
            \( -iname '*gtest*' -o -iname '*gmock*' -o -iname '*benchmark*' \) -print)"
          if [ -n "$installed" ]; then echo "$installed"; exit 1; fi

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: ./.github/actions/sccache
        with:
          phase: save
          os: linux
          part: FetchedTestTooling

  coverage:
    # Nightly only; codecov tracks main from the nightly upload.
    if: inputs.nightly
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: coverage
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: "2"

      - name: Build with coverage
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run -e coverage build-coverage

      - name: Generate coverage report
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          pixi run -e coverage --skip-deps coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: unittests
          name: codecov-umbrella
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  unity-clashes:
    # Nightly only. Compiles each multi-source target as ONE unity translation
    # unit, a superset of every batch the batch-8 unity builds (Windows CI and
    # the assertions gate) can form. Two sources of one target that share a
    # file-local name fail here, before a change to the source list puts them
    # into one batch and breaks an unrelated PR.
    if: inputs.nightly
    name: Unity name clashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: system-imgui
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: "2"

      - name: Compile each target as one unity file
        # The options of `pixi run config`, but with the vanilla system ImGui,
        # so the non-docking build stays compiled, and build type None as in
        # the assertions gate: DART forces -O3 for Release, and clashes are
        # front-end errors, so -O0 is enough. -j1: the dart and dartpy files
        # each need several GB. Single-source targets cannot clash.
        run: |
          pixi run -e system-imgui -- bash -c 'cmake -G Ninja -S . -B build/unity-clashes \
            -DCMAKE_BUILD_TYPE=None -DCMAKE_CXX_FLAGS=-O0 \
            -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=0 \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DBUILD_TESTING=ON \
            -DDART_DISABLE_COMPILER_CACHE=ON -DDART_BUILD_DARTPY=ON \
            -DDART_BUILD_PROFILE=ON -DDART_USE_SYSTEM_GOOGLEBENCHMARK=ON \
            -DDART_USE_SYSTEM_GOOGLETEST=ON -DDART_USE_SYSTEM_IMGUI=ON \
            -DDART_USE_SYSTEM_TRACY=ON -DDART_USE_SYSTEM_GLFW=ON'
          cd build/unity-clashes
          find . -path '*/Unity/unity_*_cxx.cxx' -exec grep -c -H '^#include' {} + |
            awk -F: '$2 > 1 { sub(/^\.\//, "", $1); print $1 ".o" }' > unity-objects.txt
          test -s unity-objects.txt
          xargs -a unity-objects.txt pixi run -e system-imgui ninja -j1 -k 0

  # pixi tasks pin BUILD_TYPE=Release, so a BUILD_TYPE=Debug leg would only
  # rebuild Release; the nightly coverage job is the Debug build.
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: write # Save compiler cache prunes superseded snapshots.
      contents: read
    env:
      # One build, preprocessor entries included, caches 457 MiB on CI; the
      # cap holds about two.
      SCCACHE_CACHE_SIZE: "900M"
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: default system-imgui
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Restore compiler cache
        uses: ./.github/actions/sccache
        with:
          phase: restore
          os: linux
          part: Release

      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: "2"

      - name: Check Lint
        run: |
          DART_VERBOSE=ON \
          pixi run check-lint

      - name: Test DART and dartpy
        id: build
        run: |
          # Later config/config-py tasks preserve unity in the CMake cache.
          ulimit -c 0
          pixi run config -- -DCMAKE_UNITY_BUILD=ON -DDART_BUILD_GUI=ON
          DART_VERBOSE=ON \
          pixi run test-all

      - name: Agent visual verification smoke
        run: |
          rm -rf /tmp/dart-agent-visual-smoke
          # Display-free Filament capture on the environment's Lavapipe ICD.
          export VK_DRIVER_FILES="$GITHUB_WORKSPACE/.pixi/envs/default/share/vulkan/icd.d/lvp_icd.x86_64.json"
          env -u DISPLAY -u WAYLAND_DISPLAY \
            bash -eu -o pipefail <<'VISUAL_SMOKE'
          pixi run agent-capture -- \
              --scene box_on_ground --steps 250 --focus box --auto-views 1 \
              --layers contacts collision_bounds labels \
              --width 320 --height 240 \
              --out /tmp/dart-agent-visual-smoke --prefix smoke
          pixi run image-verdict -- \
            /tmp/dart-agent-visual-smoke/smoke_auto0.png
          pixi run agent-capture -- \
              --scene dart_shape_contacts --steps 500 \
              --camera-azimuth 1.5708 --camera-elevation 0.35 \
              --camera-distance 4.5 --camera-target 0 0 0.2 \
              --layers contacts collision_bounds labels \
              --width 640 --height 480 \
              --out /tmp/dart-agent-visual-smoke --prefix dart
          pixi run image-verdict -- \
            /tmp/dart-agent-visual-smoke/dart_main.png
          VISUAL_SMOKE
          env -u DISPLAY -u WAYLAND_DISPLAY pixi run test-agent-debug-overlay

      - name: Upload agent visual verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-visual-smoke
          path: /tmp/dart-agent-visual-smoke
          if-no-files-found: error

      - name: Test with AddressSanitizer
        # Nightly only: a second full build (~1 h) on the shared runner fleet.
        if: inputs.nightly
        run: |
          DART_VERBOSE=ON \
          pixi run -e system-imgui test-asan

      - name: Install
        # Nightly only: install builds a second library tree, and CI
        # gz-physics installs DART and builds against it on every PR.
        if: inputs.nightly
        run: |
          DART_VERBOSE=ON \
          pixi run -e system-imgui install

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: ./.github/actions/sccache
        with:
          phase: save
          os: linux
          part: Release

  # Catch compile and test failures when assertions are enabled outside a Debug
  # build type (e.g., downstream builds that drop -DNDEBUG in Release).
  build-asserts:
    name: Asserts enabled (no -DNDEBUG)
    runs-on: ubuntu-latest
    permissions:
      actions: write # Save compiler cache prunes superseded snapshots.
      contents: read
    env:
      # One build, preprocessor entries included, caches 107 MiB on CI; the
      # cap holds about two.
      SCCACHE_CACHE_SIZE: "224M"
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Restore compiler cache
        uses: ./.github/actions/sccache
        with:
          phase: restore
          os: linux
          part: asserts

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: "2"

      - name: Build and test with assertions (no -DNDEBUG)
        id: build
        run: |
          # NOTE: pixi tasks set BUILD_TYPE internally, so we
          # configure this variant explicitly to ensure NDEBUG is not defined.
          pixi run -- bash -lc '
            set -euo pipefail
            BUILD_TYPE=None
            DART_VERBOSE=ON
            # Exercise the renderer-free C++ build with assertions.
            # -O2 keeps NDEBUG undefined; at -O0 the tests take hours.
            # Unity builds catch file-local name collisions on Linux too;
            # see code-style.md.
            cmake \
              -G Ninja \
              -S . \
              -B build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE \
              -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_FLAGS=-O2 \
              -DCMAKE_CXX_FLAGS=-O2 \
              -DCMAKE_UNITY_BUILD=ON \
              -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
              -DDART_BUILD_DARTPY=OFF \
              -DDART_BUILD_GUI=OFF \
              -DDART_BUILD_PROFILE=ON \
              -DDART_USE_SYSTEM_GOOGLEBENCHMARK=ON \
              -DDART_USE_SYSTEM_GOOGLETEST=ON \
              -DDART_USE_SYSTEM_IMGUI=ON \
              -DDART_USE_SYSTEM_TRACY=ON \
              -DDART_VERBOSE=$DART_VERBOSE
            cmake --build build/$PIXI_ENVIRONMENT_NAME/cpp/$BUILD_TYPE -j --target ALL
          '

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: ./.github/actions/sccache
        with:
          phase: save
          os: linux
          part: asserts

  eigen-overalignment:
    name: Eigen 64-byte alignment
    if: inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: "2"

      - name: Build and test with Eigen over-alignment
        run: |
          DART_VERBOSE=ON \
          pixi run test-eigen-overalignment
