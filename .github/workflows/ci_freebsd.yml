name: CI FreeBSD (VM)

# Manual only until the VM lane is green again: the weekly cron produced no
# passing run between 2026-05-18 and 2026-08-31 (failures and 120-minute
# timeouts) while occupying the self-hosted runner. Re-add
# `schedule: - cron: "0 4 * * 1"` once a workflow_dispatch run passes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The Docker-backed FreeBSD harness uses a fixed VM container name
  # (`dart-freebsd-vm`), so all runs must serialize instead of running in
  # independent run-specific groups.
  group: ${{ github.workflow }}-vm-container
  queue: max
  cancel-in-progress: false

jobs:
  freebsd:
    name: FreeBSD repro (VM)
    runs-on: [self-hosted, dartsim]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check runner requirements (KVM and Docker)
        run: |
          FAILED=false

          echo "=== Docker Diagnostics ==="
          if docker info > /dev/null 2>&1; then
            echo "Docker is accessible"
          else
            echo "::error::Docker not accessible - check socket permissions"
            FAILED=true
          fi

          echo ""
          echo "=== KVM Diagnostics ==="
          egrep -c '(vmx|svm)' /proc/cpuinfo || echo "No VMX/SVM support found"
          ls -la /dev/kvm 2>/dev/null || echo "/dev/kvm does not exist"
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is accessible"
          else
            echo "::error::KVM not accessible"
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "::error::FreeBSD CI requires both Docker and KVM"
            echo "Self-hosted runner setup: https://gist.github.com/jslee02/c0a6b0e4af18e4ecb2f2e8fb5b715f78"
            exit 1
          fi

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Run FreeBSD repro tests
        env:
          FREEBSD_VM_CPUS: "2"
          FREEBSD_VM_MEM: "4096"
          # Build parallelism and the ctest timeout come from the freebsd-test
          # pixi task, which owns those values.
          # Skip tests that require SDF support or crash in QEMU nested
          # virtualization (PR #2419); names that no longer exist were dropped.
          FREEBSD_VM_TEST_EXCLUDE_REGEX: "ForwardKinematics|AtlasIK|INTEGRATION_io_Read|INTEGRATION_io_UrdfParser|INTEGRATION_io_UrdfMaterialParsing|INTEGRATION_io_IkFast|UNIT_constraint_BalanceConstraint"
        run: |
          set -euo pipefail
          max_attempts=2
          for attempt in $(seq 1 $max_attempts); do
            echo "=== FreeBSD VM test attempt ${attempt}/${max_attempts} ==="
            pixi run freebsd-stop || true
            pixi run freebsd-test &
            TEST_PID=$!
            sleep 10
            echo "=== Docker Container Logs (QEMU Startup) ==="
            docker logs dart-freebsd-vm 2>&1 | head -50 || true
            echo "=============================================="
            if wait $TEST_PID; then
              echo "FreeBSD tests passed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::FreeBSD VM test failed on attempt ${attempt}/${max_attempts}"
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Retrying after cleanup..."
              pixi run freebsd-stop || true
              sleep 5
            fi
          done
          echo "::error::FreeBSD VM tests failed after ${max_attempts} attempts"
          exit 1

      - name: Show Docker container logs
        if: always()
        run: |
          echo "=== Full Docker Container Logs ==="
          docker logs dart-freebsd-vm 2>&1 || true
          echo "==================================="

      - name: Stop FreeBSD VM
        if: always()
        run: pixi run freebsd-stop || true
