# FreeBSD build + test coverage.
#
# This replaces the former Docker-wrapped QEMU harness (docker/freebsd/* +
# scripts/freebsd.py, which built and ran a `dartsim/freebsd-vm` image). The
# cross-platform-actions action boots a real FreeBSD VM directly on the hosted
# runner with no Docker, syncs the checkout in, and runs the build/test inline.
# Dependencies come from pkg; the cmake/ctest invocation mirrors the previous
# job's configuration.
#
# Uses cross-platform-actions rather than vmactions/freebsd-vm: the latter
# downloads its `anyvm` provisioning helper at run time, which started failing
# the host dependency install with a fast `sudo` exit 1. cross-platform-actions
# provisions from a pinned, prebuilt VM image instead, so there is no run-time
# download of a mutable helper.

name: CI FreeBSD (VM)

on:
  # Nightly only: nightly.yml calls this every night; dispatch it to check a
  # branch on demand.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-freebsd-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-freebsd-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  freebsd:
    name: FreeBSD repro (VM)
    # Pin the versioned GitHub-hosted label, NOT `ubuntu-latest`: the dartsim
    # self-hosted runners are *also* labeled `ubuntu-latest`, so an
    # `ubuntu-latest` job can be scheduled onto those locked-down Docker
    # containers (no fdisk, no usable apt, no nested virtualization) and fail in
    # host setup. They do not carry the `ubuntu-24.04` label, so pinning it keeps
    # this job on GitHub-hosted runners where the VM action works.
    runs-on: ubuntu-24.04
    # Slower hosted VMs need over two hours for the build and test suite.
    # Allow runner-speed variation while retaining ctest's per-test timeout.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cross-platform-actions invokes `fdisk` on the host to size the VM disk.
      # It is present on GitHub-hosted runners; install it only as a fallback,
      # and make sure /usr/sbin is on PATH for the action.
      - name: Ensure fdisk is available for the FreeBSD VM
        run: |
          command -v fdisk >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y fdisk; }
          echo /usr/sbin >> "$GITHUB_PATH"

      - name: Build and test DART on FreeBSD
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          # Latest FreeBSD 14.x production release. The action's pinned builder
          # publishes a 14.4 image, and matching the current production minor
          # keeps `pkg install` aligned with the binary package repository
          # (older minors can hit pkg OS-version mismatches once the repo is
          # rebuilt for a newer minor).
          version: "14.4"
          memory: 6G
          # Sync the checkout into the VM only; nothing downstream consumes the
          # build tree, so skip the (slow, timeout-risking) copy back
          # from the VM. Mirrors the former vmactions `copyback: false`.
          sync_files: runner-to-vm
          # Run the build script under sh: the action otherwise uses the guest
          # account's default shell (csh on FreeBSD), which cannot execute this
          # POSIX `set -e` script. Mirrors the former vmactions `usesh: true`.
          shell: sh
          # Commands run as a passwordless-sudo user.
          run: |
            set -e
            # Install build dependencies from pkg.
            sudo pkg update -f
            sudo pkg install -y \
              assimp boost-libs cmake eigen libfmt git gmake googletest \
              ninja octomap ode-double pkgconf spdlog tinyxml2 \
              ros-urdfdom ros-urdfdom_headers
            # FreeBSD's libccd package keeps libccd's single-precision default,
            # so the package's FCL runs GJK/EPA in float. DART's FCL detector
            # routes primitive pairs that FCL has no dedicated algorithm for,
            # such as cylinder-box, through GJK/EPA, and the float contact
            # normals alone spin the base in
            # Issue201.ShallowSupportKeepsOffAxisRigidBodyMomentum up to
            # 0.04 rad/s (#3590). Build libccd in double precision, as
            # conda-forge, Debian and Homebrew ship it, and FCL against it.
            # The tarballs are the ones the ports build from, and
            # `-include cassert` is the ports' fix for FCL.
            fetch -o /tmp/libccd.tar.gz https://github.com/danfis/libccd/archive/refs/tags/v2.1.tar.gz
            sha256 -c 542b6c47f522d581fbf39e51df32c7d1256ac0c626e7c2b41f1040d4b9d50d1e /tmp/libccd.tar.gz
            fetch -o /tmp/fcl.tar.gz https://github.com/flexible-collision-library/fcl/archive/refs/tags/0.7.0.tar.gz
            sha256 -c 90409e940b24045987506a6b239424a4222e2daf648c86dd146cbcb692ebdcbc /tmp/fcl.tar.gz
            tar -xzf /tmp/libccd.tar.gz -C /tmp
            tar -xzf /tmp/fcl.tar.gz -C /tmp
            cmake -G Ninja -S /tmp/libccd-2.1 -B /tmp/build-libccd \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DENABLE_DOUBLE_PRECISION=ON
            cmake --build /tmp/build-libccd
            sudo cmake --install /tmp/build-libccd
            cmake -G Ninja -S /tmp/fcl-0.7.0 -B /tmp/build-fcl \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_CXX_FLAGS="-include cassert" \
              -DBUILD_TESTING=OFF
            cmake --build /tmp/build-fcl -j2
            sudo cmake --install /tmp/build-fcl
            # DART's source tree does not natively target FreeBSD, so apply the
            # FreeBSD source-compatibility patches (formerly applied by the
            # docker/freebsd harness) before configuring. They are -p0 patches
            # applied from the repository root, in sorted order.
            for patch in tools/freebsd/patches/patch-*; do
              echo "Applying ${patch}"
              patch -p0 -N -i "${patch}"
            done
            cmake -G Ninja -S . -B build/freebsd/cpp/Release \
              -DCMAKE_BUILD_TYPE=Release \
              -DDART_BUILD_DARTPY=OFF \
              -DDART_BUILD_GUI_OSG=OFF \
              -DDART_USE_SYSTEM_GOOGLETEST=ON \
              -DDART_VERBOSE=ON
            cmake --build build/freebsd/cpp/Release --target tests -j2
            # Some dynamics tests are much slower in the hosted-runner VM; keep
            # the test coverage but avoid the inherited 10-minute per-test cap
            # from failing a still-progressing run.
            # `long-measurement` tests are excluded: the soft-foot push-recovery
            # sweep alone measures 3674 s in the VM (~190x bare metal),
            # which starves the remaining suite inside this job's
            # wall-clock budget, and a deterministic parameter sweep adds
            # no portability signal beyond the correctness gates that stay in.
            ctest --test-dir build/freebsd/cpp/Release --output-on-failure --timeout 1800 --label-exclude long-measurement
