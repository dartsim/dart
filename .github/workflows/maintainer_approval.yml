# The maintainer-approved label approves merging the PR head the maintainer
# reviewed (docs/onboarding/ai-tools.md, "PR Lifecycle"). This workflow removes
# the label when the PR changes after approval: when it is retargeted to
# another base branch, reopened, or gets new commits. New commits keep the label
# only if every one is a conflict-free merge of the base branch: a two-parent
# merge of commits already on the base whose result matches what git would
# produce automatically.
#
# Pushes made with GITHUB_TOKEN start no workflows, so workflows that update PR
# branches that way remove the label themselves (update_lockfiles.yml). A run
# can still miss a change, for example when it is cancelled before it starts, so
# whoever merges also checks that the label postdates the head's last push.
#
# pull_request_target lets the job edit labels on fork PRs too. It never checks
# out or runs PR code: it only fetches commits and compares them with git.

name: Maintainer Approval

on:
  pull_request_target:
    types: [synchronize, edited, reopened]

permissions: {}

jobs:
  revoke-stale-approval:
    name: Revoke stale approval
    # Title and description edits keep the approval; a base change does not.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'maintainer-approved')
      && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Check whether the push only merged the base branch
        id: check
        if: github.event.action == 'synchronize'
        timeout-minutes: 10
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          only_clean_base_merges() {
            git init -q approval && cd approval || return 1
            git remote add origin "https://github.com/$REPO" || return 1
            git fetch -q --filter=blob:none origin \
              "+refs/heads/$BASE:refs/base" "$BEFORE" "$AFTER" || return 1
            if ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
              echo "The push rewrote the branch history."
              return 1
            fi
            commits=$(git rev-list "$BEFORE..$AFTER" --not refs/base) || return 1
            for c in $commits; do
              parents=$(git rev-list --parents -n 1 "$c") || return 1
              read -r _ _ merged extra <<< "$parents"
              if [ -z "$merged" ] || [ -n "$extra" ] \
                || ! git merge-base --is-ancestor "$merged" refs/base; then
                echo "$c is not a merge of commits already on $BASE."
                return 1
              fi
              diff=$(git show --remerge-diff --format= "$c") || return 1
              if [ -n "$diff" ]; then
                echo "$c differs from the automatic merge (conflict resolution or other edits)."
                return 1
              fi
            done
          }
          if only_clean_base_merges; then
            echo "Only conflict-free merges of $BASE were pushed; keeping maintainer-approved."
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs unless the check above passed, so a failed, timed-out or cancelled
      # check also revokes the approval.
      - name: Remove maintainer-approved
        if: always() && steps.check.outputs.clean != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          # A run that starts late, or is rerun, must not remove an approval the
          # maintainer gave after the event that created the run. If either
          # lookup fails, remove the label anyway. An approval given within
          # seconds of the event can still be removed; add the label again.
          created=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at) || created=""
          labeled=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "maintainer-approved") | .created_at' \
            | sort | tail -n 1) || labeled=""
          if [ -n "$created" ] && [[ "$labeled" > "$created" ]]; then
            echo "maintainer-approved was added at $labeled, after this $ACTION event ($created); keeping it."
          elif out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/maintainer-approved" 2>&1); then
            echo "Removed maintainer-approved after the $ACTION event: the PR needs a fresh maintainer review."
          elif grep -q "Label does not exist" <<< "$out"; then
            echo "maintainer-approved was already removed."
          else
            echo "$out"
            exit 1
          fi
