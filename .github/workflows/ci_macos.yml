# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI macOS

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly-only jobs"
        type: boolean
        default: false
  # Nightly (nightly.yml) calls this with `nightly: true` every night.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-macos-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-macos-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  build:
    name: arm64-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    env:
      # A cold build caches 54 MiB on CI; the cap holds about two and a half.
      SCCACHE_CACHE_SIZE: "128M"
      CTEST_PARALLEL_LEVEL: 3
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # pixi tasks pin BUILD_TYPE=Release, so a Debug leg would only rebuild
        # Release; CI Linux's nightly coverage job is the Debug build.
        build_type: ["Release"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Restore compiler cache
        uses: ./.github/actions/sccache
        with:
          phase: restore
          os: macos
          part: ${{ matrix.build_type }}

      - name: Test DART and dartpy
        id: build
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=${{ matrix.build_type }} \
          pixi run test-all

      - name: Install
        # Nightly only: install rebuilds a separate Release tree; CI
        # gz-physics installs DART and builds against it on every PR.
        if: inputs.nightly
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=${{ matrix.build_type }} \
          pixi run install

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: ./.github/actions/sccache
        with:
          phase: save
          os: macos
          part: ${{ matrix.build_type }}

  prune-sccache:
    name: Prune compiler caches
    needs: [build]
    # Forks cannot save/delete caches; nightly calls and dispatches only read.
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune superseded compiler caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Run IDs follow push order; a slow older run must not evict a newer one.
          gh cache list --ref "$GITHUB_REF" --key sccache-v2-macos- --limit 100 --json id,key \
            --jq 'group_by(.key | split("-")[3:5]) | map(sort_by(.key | split("-")[6:8] | map(tonumber)) | .[:-1][]) | .[].id' |
            xargs -r -n1 gh cache delete
          # Main pushes also drop this prefix's PR snapshots idle for a day.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # $ENV is jq's, not the shell's.
            # shellcheck disable=SC2016
            CUTOFF=$(date -u -d '1 day ago' +%FT%TZ) gh cache list --key sccache-v2-macos- --limit 1000 --json id,ref,lastAccessedAt \
              --jq '.[] | select((.ref | startswith("refs/pull/")) and .lastAccessedAt < $ENV.CUTOFF) | .id' |
              xargs -r -n1 gh cache delete
          fi
