# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI macOS

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  schedule:
    # Weekly drift canary. The minute offsets between the platform crons are
    # cosmetic: GitHub's cron jitter (often 30-60 min, sometimes hours) and the
    # ~100 min Linux/Windows runs make the runs overlap anyway.
    - cron: "40 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch')
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # dorny/paths-filter lists changed files through the pull-request API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # PR events list files through the API; push events fetch the `before`
      # commit on demand, so a full-history clone is not needed here.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters/ci-code.yml
          # Required so the `!` exclusions in the filter file act as excludes.
          predicate-quantifier: some-with-excludes

  build-release:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    name: Release Tests (arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Parallelize the ctest phase (CI previously ran tests sequentially).
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          sccache-continue-on-error: true

      - name: Configure environment for compiler cache
        uses: ./.github/actions/configure-compiler-cache
        with:
          # sccache setup is best-effort on macOS (transient download
          # timeouts); report a missing launcher in the step summary instead
          # of failing the required check. Linux and Windows keep the guard.
          require-cache: "false"

      - name: Run Release C++ tests
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run test ON Release

      - name: Run Release Python tests
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run test-py ON Release

      - name: Build Release examples
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run build-examples ON Release

      - name: Install
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Release \
          pixi run install

  build-debug:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    name: Debug Tests (arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # Parallelize the ctest phase (CI previously ran tests sequentially).
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          sccache-continue-on-error: true

      - name: Configure environment for compiler cache
        uses: ./.github/actions/configure-compiler-cache
        with:
          # sccache setup is best-effort on macOS (transient download
          # timeouts); report a missing launcher in the step summary instead
          # of failing the required check. Linux and Windows keep the guard.
          require-cache: "false"

      - name: Run Debug C++ tests
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=Debug \
          DART_BUILD_DARTPY_OVERRIDE=OFF \
          pixi run test ON Debug
