# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI macOS

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly-only jobs"
        type: boolean
        default: false
  # Nightly (nightly.yml) calls this with `nightly: true` every night.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-macos-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-macos-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  build:
    name: arm64-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    env:
      CTEST_PARALLEL_LEVEL: 3
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # Debug runs nightly only.
        build_type: ${{ fromJSON(inputs.nightly && '["Release", "Debug"]' || '["Release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      # Compiler cache: restored on every run, saved from main at most once a
      # day per configuration (the repository's Actions cache is 10 GB).
      - name: Restore compiler cache
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"
          echo "SCCACHE_DAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-macos-${{ matrix.build_type }}-${{ env.SCCACHE_DAY }}
          restore-keys: sccache-macos-${{ matrix.build_type }}-

      - name: Test DART and dartpy
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=${{ matrix.build_type }} \
          pixi run test-all

      - name: Install
        # Nightly only: install rebuilds a separate Release tree; CI Linux
        # checks installation on every PR.
        if: inputs.nightly
        run: |
          DART_VERBOSE=ON \
          BUILD_TYPE=${{ matrix.build_type }} \
          pixi run install

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-macos-${{ matrix.build_type }}-${{ env.SCCACHE_DAY }}

