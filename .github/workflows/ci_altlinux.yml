name: CI Alt Linux (Docker)

# Distro-reproducibility coverage. This runs on the weekly schedule and via
# manual dispatch only: the Alt Linux Docker bootstrap is slow (Sisyphus
# mirror fetches can consume most of the runner window) and distro repro
# breakage is effectively never PR-local, so it fits the scheduled/manual
# tier of the CI tiering policy rather than the PR tier.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual evidence. There are no branch-push validations in
  # this workflow.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch')
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch' }}

jobs:
  altlinux:
    name: Alt Linux repro (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Run Alt Linux repro tests
        run: pixi run altlinux-test

      - name: Stop Alt Linux container
        if: always()
        run: pixi run altlinux-stop
