# Nightly: the full CI matrix on main, including the slow or niche jobs
# that do not run per PR (see docs/onboarding/ci-cd.md). A failing night opens
# or updates one `nightly-failure` issue with fixing instructions; the next
# green night closes it. To try a CI change against the whole matrix, dispatch
# it on the branch (`gh workflow run nightly.yml --ref <branch>`); the report
# only dry-runs off main.

name: Nightly

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs.
    - cron: "17 8 * * *" # Daily at 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}

env:
  NIGHTLY_BRANCH: main

jobs:
  linux:
    uses: ./.github/workflows/ci_ubuntu.yml
    # Called build jobs request actions: write to prune compiler caches
    # (skipped at night); a called job cannot exceed the caller's permissions.
    permissions:
      actions: write
      contents: read
    with:
      nightly: true
    secrets: inherit

  macos:
    uses: ./.github/workflows/ci_macos.yml
    # Called build jobs request actions: write to prune compiler caches
    # (skipped at night); a called job cannot exceed the caller's permissions.
    permissions:
      actions: write
      contents: read
    with:
      nightly: true

  windows:
    uses: ./.github/workflows/ci_windows.yml
    # Called build jobs request actions: write to prune compiler caches
    # (skipped at night); a called job cannot exceed the caller's permissions.
    permissions:
      actions: write
      contents: read
    with:
      nightly: true

  filament:
    uses: ./.github/workflows/ci_filament.yml
    with:
      nightly: true

  freebsd:
    uses: ./.github/workflows/ci_freebsd.yml

  toolchain:
    uses: ./.github/workflows/ci_toolchain.yml

  stock-noble:
    uses: ./.github/workflows/ci_stock_noble.yml

  collision-fetch:
    name: CMake 4 ODE and Bullet fetch fallbacks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Build, test, install, and uninstall fetched collision libraries
        run: |
          pixi run bash -euc '
            cmake --version
            install_prefix=$(mktemp -d)
            cmake -G Ninja -S . -B build/collision-fetch \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX="$install_prefix" \
              -DDART_USE_SYSTEM_DEPENDENCIES=ON \
              -DDART_USE_SYSTEM_ODE=OFF -DDART_USE_SYSTEM_BULLET=OFF \
              -DDART_BUILD_GUI=OFF -DDART_BUILD_DARTPY=OFF -DDART_BUILD_PROFILE=OFF
            # Pixi has system packages too; prove these switches selected fetched sources.
            grep -E "^DART_ODE_SOURCE_DIR:INTERNAL=.*_deps/ode-src$" build/collision-fetch/CMakeCache.txt
            grep -E "^DART_BULLET_SOURCE_DIR:INTERNAL=.*_deps/bullet-src$" build/collision-fetch/CMakeCache.txt
            cmake --build build/collision-fetch --target all tests -j 2
            ninja -C build/collision-fetch -t commands dart > build/collision-fetch/commands.txt
            grep " -o lib/libdart" build/collision-fetch/commands.txt > build/collision-fetch/link-commands.txt
            grep -E "_deps/ode-build/.*libode" build/collision-fetch/link-commands.txt
            grep -E "_deps/bullet-build/.*libBulletCollision" build/collision-fetch/link-commands.txt
            grep -E "_deps/bullet-build/.*libLinearMath" build/collision-fetch/link-commands.txt
            ctest --test-dir build/collision-fetch --output-on-failure -j 2
            cmake --install build/collision-fetch
            test ! -e "$install_prefix/include/btBulletDynamicsCommon.h"
            cmake -G Ninja -S tools/package -B build/collision-fetch-consumer \
              -DDART_DIR="$install_prefix/share/dart/cmake" \
              -DCMAKE_PREFIX_PATH="$install_prefix;$CONDA_PREFIX" \
              -DDART_TEST_COMPONENTS="collision-ode;collision-bullet"
            cmake --build build/collision-fetch-consumer -j 2
            export LD_LIBRARY_PATH="$install_prefix/lib:$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ctest --test-dir build/collision-fetch-consumer --output-on-failure -j 2
            ldd build/collision-fetch-consumer/package_collision > build/collision-fetch-consumer/ldd.txt
            for library in BulletCollision LinearMath ode; do
              grep -F "=> $install_prefix/lib/lib${library}.so" build/collision-fetch-consumer/ldd.txt
            done
            cmake --build build/collision-fetch --target dart-uninstall -j 2
            test -z "$(find "$install_prefix" \( -type f -o -type l \) -print -quit)"
            rm -rf "$install_prefix"
          '

  simd:
    uses: ./.github/workflows/ci_simd.yml

  gz-physics:
    uses: ./.github/workflows/ci_gz_physics.yml
    # Called build jobs request actions: write to prune compiler caches
    # (skipped at night); a called job cannot exceed the caller's permissions.
    permissions:
      actions: write
      contents: read

  api-doc:
    uses: ./.github/workflows/api_doc.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  dartpy-wheels:
    uses: ./.github/workflows/publish_dartpy.yml
    with:
      nightly: true

  perf:
    uses: ./.github/workflows/perf.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      tier: nightly

  report:
    needs:
      - linux
      - macos
      - windows
      - filament
      - freebsd
      - toolchain
      - stock-noble
      - collision-fetch
      - simd
      - gz-physics
      - api-doc
      - codeql
      - dartpy-wheels
      - perf
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/nightly_ci_report.py
          sparse-checkout-cone-mode: false

      - name: Open, update, or close nightly-failure issues
        run: |
          # Only real nightly runs touch issues; other refs dry-run.
          dry_run=--dry-run
          if [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = "$NIGHTLY_BRANCH" ]; }; then
            dry_run=
          fi
          python3 scripts/nightly_ci_report.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --branch "$NIGHTLY_BRANCH" $dry_run
        env:
          GH_TOKEN: ${{ github.token }}
