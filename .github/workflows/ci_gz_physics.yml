# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI gz-physics

on:
  push:
    # Feature-branch validation happens via pull_request; run on push only for
    # main and the release lines so PR branches are not built twice per push.
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  # Nightly (nightly.yml) runs this workflow on main every night.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Protected branches (main, release-*) should finish every post-merge run.
  # GitHub's default concurrency queue keeps only one pending run, so use a
  # run-specific group on release refs while keeping PR/topic refs cancellable.
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        && format('ci-gz-physics-{0}-{1}-{2}', github.workflow, github.ref, github.run_id)
        || format('ci-gz-physics-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  api_inventory:
    name: DART API inventory freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read recorded Gazebo revisions
        id: revisions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          sources = json.loads(Path('tools/gazebo/compat/dart_api_inventory.json').read_text())['sources']
          for name, source in sources.items():
              print(f'{name}={source["sha"]}')
          PY

      - name: Checkout recorded gz-physics
        uses: actions/checkout@v7
        with:
          repository: gazebosim/gz-physics
          ref: ${{ steps.revisions.outputs.gz-physics }}
          path: .pixi/gz-inventory/gz-physics
          persist-credentials: false

      - name: Checkout recorded gz-sim
        uses: actions/checkout@v7
        with:
          repository: gazebosim/gz-sim
          ref: ${{ steps.revisions.outputs.gz-sim }}
          path: .pixi/gz-inventory/gz-sim
          persist-credentials: false

      - name: Check inventory freshness
        run: |
          python scripts/gz_dart_api_inventory.py --check \
            .pixi/gz-inventory/gz-physics --gz-sim .pixi/gz-inventory/gz-sim

  test_gazebo:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      actions: write # Save compiler cache prunes superseded snapshots.
      contents: read
    env:
      # One build, preprocessor entries included, caches 154 MiB on CI; the
      # cap holds about two.
      SCCACHE_CACHE_SIZE: "320M"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi

      - name: Restore compiler cache
        uses: ./.github/actions/sccache
        with:
          phase: restore
          os: linux
          part: gz
          pixi-environment: gazebo

      - name: Install apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev
          version: 1.0

      - name: Test gz-physics
        id: build
        run: |
          pixi r -e gazebo test-gz

      - name: Compiler cache stats
        if: always()
        run: pixi run sccache --show-stats || true

      - name: Save compiler cache
        if: >-
          always()
          && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        uses: ./.github/actions/sccache
        with:
          phase: save
          os: linux
          part: gz
          pixi-environment: gazebo
