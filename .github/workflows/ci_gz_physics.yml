# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: CI gz-physics

on:
  push:
    branches:
      - "release-*"
  pull_request:
    branches:
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual/tag evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v'))
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch'
        && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # dorny/paths-filter lists changed files through the pull-request API.
      pull-requests: read
    outputs:
      core_branch_push: ${{ steps.scope.outputs.core_branch_push }}
      code: ${{ steps.filter.outputs.code }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      # PR events list files through the API; push events fetch the `before`
      # commit on demand, so a full-history clone is not needed here.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-scope
        id: scope
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters/ci-code.yml
          # Required so the `!` exclusions in the filter file act as excludes.
          predicate-quantifier: some-with-excludes

  test_gazebo:
    needs: changes
    if: >-
      (needs.changes.outputs.full_ci == 'true' ||
      needs.changes.outputs.core_branch_push == 'true') &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true')
    name: GZ Physics Tests
    runs-on: ubuntu-latest
    # DART + gz-physics + gz-sim from source; 30-130 min observed.
    timeout-minutes: 240
    env:
      # Keep parallelism modest to avoid process limits on shared runners.
      DART_PARALLEL_JOBS: 8
      # Avoid spawning too many ninja processes on shared runners (posix_spawn failures)
      CMAKE_BUILD_PARALLEL_LEVEL: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pixi (CI)
        uses: ./.github/actions/setup-pixi-ci
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          environments: gazebo
          install-args: -e gazebo

      - name: Install apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: 1.0

      - name: Configure environment for compiler cache
        uses: ./.github/actions/configure-compiler-cache

      - name: Test gz-physics
        env:
          DART_PARALLEL_JOBS: 8
        run: |
          pixi r -e gazebo test-gz
