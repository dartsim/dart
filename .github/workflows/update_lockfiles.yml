name: Update Lock Files

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * SAT # Runs at 05:00, on every Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi-update:
    # always() keeps the post-update approval cleanup alive on cancellation;
    # the other steps still stop.
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [main]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          run-install: false
      - name: Update lockfiles
        run: |
          pixi update --json --no-install | pixi exec pixi-diff-to-markdown >> diff.md
      # Pushes made with GITHUB_TOKEN do not trigger maintainer_approval.yml,
      # so this job revokes approval of the open lockfile PR itself: before it
      # replaces the head with a different lockfile, and again after any update.
      - name: Remove maintainer-approved before changing the lockfile pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: update-pixi-${{ matrix.base }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          prs=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH&base=$BASE" --jq '.[].number')
          # An unchanged lockfile leaves the PR as it is, approval included.
          if [ -z "$prs" ] || { git fetch -q origin "$BRANCH" && git diff --quiet FETCH_HEAD -- pixi.lock; }; then
            exit 0
          fi
          for pr in $prs; do
            if ! out=$(gh api -X DELETE "repos/$REPO/issues/$pr/labels/maintainer-approved" 2>&1) \
              && ! grep -q "Label does not exist" <<< "$out"; then
              echo "$out"
              exit 1
            fi
          done
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi-${{ matrix.base }}
          base: ${{ matrix.base }}
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
      - name: Remove maintainer-approved after updating the lockfile pull request
        # After an update, and after a failed or cancelled attempt, but not when
        # an earlier failure skipped it or it found nothing to change.
        if: >-
          always() && steps.cpr.outcome != 'skipped'
          && steps.cpr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: update-pixi-${{ matrix.base }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          prs=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH&base=$BASE" --jq '.[].number')
          for pr in $prs; do
            # Keep an approval given after the generated head was committed;
            # if a lookup fails, remove the label anyway.
            head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha) || head=""
            committed=$(gh api "repos/$REPO/commits/$head" --jq .commit.committer.date) || committed=""
            labeled=$(gh api --paginate "repos/$REPO/issues/$pr/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "maintainer-approved") | .created_at' \
              | sort | tail -n 1) || labeled=""
            if [ -n "$committed" ] && [[ "$labeled" > "$committed" ]]; then
              continue
            fi
            if ! out=$(gh api -X DELETE "repos/$REPO/issues/$pr/labels/maintainer-approved" 2>&1) \
              && ! grep -q "Label does not exist" <<< "$out"; then
              echo "$out"
              exit 1
            fi
          done
