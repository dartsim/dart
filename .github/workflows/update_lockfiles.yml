name: Update Lock Files

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * SAT # Runs at 05:00, on every Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [main]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          run-install: false
      - name: Update lockfiles
        run: |
          pixi update --json --no-install | pixi exec pixi-diff-to-markdown >> diff.md
      # Pushes made with GITHUB_TOKEN do not trigger maintainer_approval.yml,
      # so this job revokes approval of the open lockfile PR itself: before
      # replacing its head, and again afterwards for a label added meanwhile.
      - name: Remove maintainer-approved before updating the lockfile pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: update-pixi-${{ matrix.base }}
        run: |
          set -o pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number,headRepositoryOwner \
            --jq ".[] | select(.headRepositoryOwner.login == \"$OWNER\") | .number")
          if [ -n "$pr" ] && ! out=$(gh api -X DELETE "repos/$REPO/issues/$pr/labels/maintainer-approved" 2>&1) \
            && ! grep -q "Label does not exist" <<< "$out"; then
            echo "$out"
            exit 1
          fi
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi-${{ matrix.base }}
          base: ${{ matrix.base }}
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
      - name: Remove maintainer-approved after updating the lockfile pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: update-pixi-${{ matrix.base }}
        run: |
          set -o pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number,headRepositoryOwner \
            --jq ".[] | select(.headRepositoryOwner.login == \"$OWNER\") | .number")
          if [ -n "$pr" ] && ! out=$(gh api -X DELETE "repos/$REPO/issues/$pr/labels/maintainer-approved" 2>&1) \
            && ! grep -q "Label does not exist" <<< "$out"; then
            echo "$out"
            exit 1
          fi
