name: Update Lock Files

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    # Friday night Pacific time, so lockfile PRs are ready by Saturday morning.
    - cron: "0 22 * * FRI"
      timezone: "America/Los_Angeles"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  discover-base-branches:
    name: Maintenance | Discover lockfile bases
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.branches.outputs.bases }}
    steps:
      - name: Discover latest DART 6 release branch
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          release_branch=$(
            git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "release-6.*" |
              awk '{ sub("refs/heads/", "", $2); print $2 }' |
              sort -V |
              tail -n 1
          )

          if [ -z "${release_branch}" ]; then
            echo "No release-6.* branch found" >&2
            exit 1
          fi

          printf 'bases=["main","%s"]\n' "${release_branch}" >> "${GITHUB_OUTPUT}"

  pixi-update:
    name: Maintenance | Update pixi.lock (${{ matrix.base }})
    needs: discover-base-branches
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.base }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.discover-base-branches.outputs.bases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
      - name: Setup pixi (CI)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: false
          run-install: false
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
      - name: Update lockfiles
        run: |
          set -o pipefail
          pixi update --json --no-install | pixi exec pixi-diff-to-markdown >> diff.md
      - name: Validate default Python lock policy
        shell: bash
        run: |
          set -euo pipefail

          expected_spec=""
          mapfile -t platforms < <(
            pixi workspace platform list --json |
              jq -r '.platforms[] | select(.name != "current") | .subdir'
          )

          if (( ${#platforms[@]} == 0 )); then
            echo "No declared workspace platforms found" >&2
            exit 1
          fi

          for platform in "${platforms[@]}"; do
            python_package=$(
              pixi list --locked --json -e default --platform "${platform}" '^python$'
            )
            if ! jq -e '
              length == 1
              and .[0].name == "python"
              and .[0].requested_spec != null
            ' <<< "${python_package}" > /dev/null; then
              echo "Default Python lock policy failed for ${platform}:" >&2
              jq >&2 <<< "${python_package}"
              exit 1
            fi

            version=$(jq -r '.[0].version' <<< "${python_package}")
            requested_spec=$(jq -r '.[0].requested_spec' <<< "${python_package}")
            if [[ ! "${requested_spec}" =~ ^[0-9]+\.[0-9]+\.\*$ ]]; then
              echo "Default Python must use an explicit minor-version pin;" \
                "${platform} requested '${requested_spec}'" >&2
              exit 1
            fi

            version_prefix=${requested_spec%\*}
            if [[ "${version}" != "${version_prefix}"* ]]; then
              echo "Default Python ${version} does not satisfy" \
                "${requested_spec} on ${platform}" >&2
              exit 1
            fi

            if [[ -z "${expected_spec}" ]]; then
              expected_spec=${requested_spec}
            elif [[ "${requested_spec}" != "${expected_spec}" ]]; then
              echo "Default Python pins differ across platforms:" \
                "expected ${expected_spec}, found ${requested_spec} on ${platform}" >&2
              exit 1
            fi

            printf '%s: python %s (%s)\n' \
              "${platform}" "${version}" "${requested_spec}"
          done
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi-${{ matrix.base }}
          base: ${{ matrix.base }}
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
