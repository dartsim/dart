name: Update Lock Files

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * SAT # Runs at 05:00, on every Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [main]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          run-install: false
      - name: Update lockfiles
        run: |
          pixi update --json --no-install | pixi exec pixi-diff-to-markdown >> diff.md
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi-${{ matrix.base }}
          base: ${{ matrix.base }}
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
      # Pushes made with GITHUB_TOKEN do not trigger maintainer_approval.yml,
      # so revoke an approval of the replaced lockfile here.
      - name: Remove maintainer-approved from the updated pull request
        if: steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx maintainer-approved; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/maintainer-approved" > /dev/null
          fi
