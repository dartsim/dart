# Scheduled Gazebo compatibility canary for the DART 6 LTS lane.
#
# GitHub only runs `schedule:` triggers from the default branch, so the cron
# entries inside the release-6.* workflows never fire. This workflow lives on
# main and checks out each active DART 6 release branch, then runs that
# branch's own `test-gz` task (gz-physics + gz-sim built from source against
# the branch's DART build). It revalidates downstream Gazebo compatibility
# between release-line merges — e.g. after upstream gz movement or dependency
# drift — without adding anything to PR CI.
#
# The per-PR gz gate on the release branches themselves is unchanged; this is
# the continuous/scheduled tier for the same coverage.

name: CI DART 6 Gazebo Canary

on:
  schedule:
    # Weekly (Monday). The minute offsets between crons are cosmetic under
    # GitHub's cron jitter.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve scheduled/manual evidence. There are no branch-push validations in
  # this workflow.
  group: >-
    ${{ (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch')
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.event_name != 'workflow_dispatch' }}

jobs:
  discover-release-branch:
    name: Discover the active DART 6 release branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Discover latest DART 6 release branch
        id: branches
        shell: bash
        run: |
          set -euo pipefail
          # Same discovery as update_lockfiles.yml, so the canary and the
          # lockfile refresh always agree on the active LTS lane.
          release_branch=$(
            git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "release-6.*" |
              awk '{ sub("refs/heads/", "", $2); print $2 }' |
              sort -V |
              tail -n 1
          )
          if [ -z "${release_branch}" ]; then
            echo "No release-6.* branch found" >&2
            exit 1
          fi
          printf 'branches=["%s"]\n' "${release_branch}" >> "${GITHUB_OUTPUT}"

  gz-canary:
    name: gz-physics + gz-sim (${{ matrix.branch }})
    needs: discover-release-branch
    runs-on: ubuntu-latest
    # DART build + gz-physics + gz-sim from source; observed 30-130 min on the
    # release-line PR gate depending on runner load.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover-release-branch.outputs.branches) }}
    env:
      DART_PARALLEL_JOBS: 8
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      # The release branches predate the setup-pixi-ci composite action, and
      # this job runs their checkout, so use setup-pixi directly like the
      # release-line workflows do.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Environment caching is off repository-wide: the entries competed
          # with the compiler cache for the 10 GB Actions cache budget.
          cache: false
          environments: gazebo

      - name: Install apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: 1.0

      - name: Test gz-physics and gz-sim against ${{ matrix.branch }}
        run: pixi run -e gazebo test-gz
