name: CI SIMD Multi-Arch

# x86_64 ISA levels that the default Linux build (native -march) never
# exercises. The arm64 NEON leg that used to live here was a strict subset of
# `Release Tests (arm64)` in ci_macos.yml: NEON is selected by the compiler's
# own __ARM_NEON macro on every arm64 build, and the UNIT_simd_* tests are part
# of the `tests` target that job runs on every PR.

on:
  push:
    # Branch validation happens via pull_request; only run on push for the
    # mainline refs to avoid duplicate push+PR runs on feature branches.
    branches:
      - "main"
      - "release-*"
    paths:
      - "dart/simd/**"
      - "tests/unit/simd/**"
      - "tests/benchmark/simd/**"
      - "CMakeLists.txt"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/actions/**"
      - ".github/workflows/ci_simd.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "dart/simd/**"
      - "tests/unit/simd/**"
      - "tests/benchmark/simd/**"
      - "CMakeLists.txt"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/actions/**"
      - ".github/workflows/ci_simd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve manual evidence, but cancel superseded branch and PR
  # validations so rapid merge bursts converge on the latest ref tip.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.event_name, github.run_id)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  simd-x86-levels:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        simd_level:
          - name: scalar
            cmake_flags: "-DDART_SIMD_FORCE_SCALAR=ON"
          - name: sse42
            cmake_flags: "-DCMAKE_CXX_FLAGS=-msse4.2"
          - name: avx
            cmake_flags: "-DCMAKE_CXX_FLAGS='-mavx -mno-avx2'"
          - name: avx2
            cmake_flags: "-DCMAKE_CXX_FLAGS='-mavx2 -mfma'"
    name: x86_64 ${{ matrix.simd_level.name }}
    env:
      DART_PARALLEL_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup DART Linux CI
        uses: ./.github/actions/setup-dart-linux-ci

      - name: Build SIMD library
        run: |
          pixi run cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDART_BUILD_TESTS=ON \
            -DDART_BUILD_DARTPY=OFF \
            -DDART_BUILD_EXAMPLES=OFF \
            -DDART_BUILD_TUTORIALS=OFF \
            -DDART_BUILD_GUI=OFF \
            -DDART_BUILD_COLLISION_REFERENCE_TESTS=OFF \
            -DDART_BUILD_COLLISION_REFERENCE_BENCHMARKS=OFF \
            ${{ matrix.simd_level.cmake_flags }}

      - name: Build SIMD tests
        run: |
          pixi run cmake --build build --target \
            UNIT_simd_simd_vec_scalar \
            UNIT_simd_simd_vec_mask_scalar \
            UNIT_simd_simd_operations_scalar \
            UNIT_simd_simd_config \
            UNIT_simd_simd_edge_cases \
            UNIT_simd_simd_eigen_interop \
            UNIT_simd_simd_batch_soa \
            UNIT_simd_simd_dynamic \
            UNIT_simd_simd_geometry \
            UNIT_simd_simd_math

      - name: Run SIMD tests
        run: |
          pixi run python -I scripts/ctest_tier.py \
            --test-dir build \
            -R "^UNIT_simd"
